<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img"><title>实际生成样本：同一模型根据类别条件画横条或竖条</title><rect width="1000" height="530" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#17334a">实际生成样本：同一模型根据类别条件画横条或竖条</text><image x="30" y="115" width="104" height="104" href="data:image/png;base64,"/><image x="150" y="115" width="104" height="104" href="data:image/png;base64,"/><image x="270" y="115" width="104" height="104" href="data:image/png;base64,"/><image x="390" y="115" width="104" height="104" href="data:image/png;base64,"/><image x="510" y="115" width="104" height="104" href="data:image/png;base64,"/><image x="630" y="115" width="104" height="104" href="data:image/png;base64,"/><image x="750" y="115" width="104" height="104" href="data:image/png;base64,"/><image x="870" y="115" width="104" height="104" href="data:image/png;base64,"/><image x="30" y="287" width="104" height="104" href="data:image/png;base64,"/><image x="150" y="287" width="104" height="104" href="data:image/png;base64,"/><image x="270" y="287" width="104" height="104" href="data:image/png;base64,"/><image x="390" y="287" width="104" height="104" href="data:image/png;base64,"/><image x="510" y="287" width="104" height="104" href="data:image/png;base64,"/><image x="630" y="287" width="104" height="104" href="data:image/png;base64,"/><image x="750" y="287" width="104" height="104" href="data:image/png;base64,"/><image x="870" y="287" width="104" height="104" href="data:image/png;base64,"/><text x="30" y="91" font-size="21" fill="#17334a">条件 0：竖条（从新噪声生成的前 8 张）</text><text x="30" y="263" font-size="21" fill="#17334a">条件 1：横条（从新噪声生成的前 8 张）</text><text x="30" y="465" font-size="22" fill="#17334a">64 张新噪声样本的方向匹配：100.0%（受限规则指标）</text><text x="30" y="506" font-size="17" fill="#536c80">任务仅有六张 8×8 模板；没有验证自然图像质量、未见场景泛化或自然语言理解。</text></g></svg>