<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img"><title>语言学实验：控制一个因素，再检查画面变化</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="515" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">语言学实验：控制一个因素，再检查画面变化</text><rect x="30" y="112" width="440" height="118" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="142" font-size="21" fill="#17334a" font-weight="400">固定：模型、采样器、步数、随机种子</text><text x="44" y="171" font-size="21" fill="#17334a" font-weight="400">只改：一个关键语言因素</text><text x="44" y="200" font-size="21" fill="#17334a" font-weight="400">例：left ↔ right，red ↔ blue</text><rect x="530" y="112" width="440" height="118" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="544" y="142" font-size="21" fill="#17334a" font-weight="400">固定：提示词及其他参数</text><text x="544" y="171" font-size="21" fill="#17334a" font-weight="400">只改：随机种子</text><text x="544" y="200" font-size="21" fill="#17334a" font-weight="400">观察同一要求下的输出变化</text><text x="30" y="300" font-size="23" fill="#17334a" font-weight="400">最小对照 1：a red square to the left / right of a blue circle</text><text x="30" y="347" font-size="23" fill="#17334a" font-weight="400">最小对照 2：a cat eating a fish / a fish eating a cat</text><text x="30" y="401" font-size="21" fill="#17334a" font-weight="400">分别标注：对象、属性、数量、关系、文字可读性和两语言的信息等值。</text><text x="30" y="447" font-size="21" fill="#17334a" font-weight="400">看起来像图片与忠实表达提示词是不同评价维度；高相似度不逐条认证事实。</text><text x="30" y="491" font-size="17" fill="#536c80" font-weight="400">这里是实验设计，没有把教师写出的目标要求当成真实 Stable Diffusion 的生成结果。</text></g></svg>