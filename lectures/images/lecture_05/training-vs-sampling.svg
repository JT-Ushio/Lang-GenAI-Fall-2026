<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img"><title>区分三件事：公式验证、模型训练、从噪声生成</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="475" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">区分三件事：公式验证、模型训练、从噪声生成</text><text x="30" y="98" font-size="23" fill="#17334a" font-weight="600">训练：标准答案可构造</text><text x="530" y="98" font-size="23" fill="#17334a" font-weight="600">生成：没有那张已知原图</text><rect x="30" y="128" width="430" height="115" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="158" font-size="21" fill="#17334a" font-weight="400">训练样本 → 加噪 → 预测噪声</text><text x="44" y="187" font-size="21" fill="#17334a" font-weight="400">已知 ε，计算损失并反向传播</text><text x="44" y="216" font-size="21" fill="#17334a" font-weight="400">每次训练更新模型参数</text><rect x="530" y="128" width="440" height="115" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="544" y="158" font-size="21" fill="#17334a" font-weight="400">随机初始噪声 → 重复采样更新</text><text x="544" y="187" font-size="21" fill="#17334a" font-weight="400">使用训练好的网络和调度器</text><text x="544" y="216" font-size="21" fill="#17334a" font-weight="400">每一步主要更新样本，参数固定</text><rect x="30" y="315" width="430" height="95" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="345" font-size="21" fill="#17334a" font-weight="400">已知真实 ε 的代数还原</text><text x="44" y="374" font-size="21" fill="#17334a" font-weight="400">只检查公式和数值实现</text><text x="44" y="403" font-size="21" fill="#17334a" font-weight="400">不等于模型已经学会去噪</text><rect x="530" y="315" width="440" height="95" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="544" y="345" font-size="21" fill="#17334a" font-weight="400">从纯噪声出发的实际生成</text><text x="544" y="374" font-size="21" fill="#17334a" font-weight="400">依靠学到的噪声预测和采样规则</text><text x="544" y="403" font-size="21" fill="#17334a" font-weight="400">不必恢复任何一张指定原图</text><text x="30" y="451" font-size="17" fill="#536c80" font-weight="400">课堂代码分别记录这些结果；不会把已知噪声的反算或倒放加噪动画当成模型生成。</text></g></svg>