<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img"><title>CFG：无分类器引导，用条件与无条件预测的差异调节生成</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="580" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">CFG：无分类器引导，用条件与无条件预测的差异调节生成</text><rect x="30" y="110" width="280" height="95" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="140" font-size="21" fill="#17334a" font-weight="400">同一个噪声状态 x<tspan baseline-shift="sub" font-size="70%">t</tspan></text><text x="44" y="169" font-size="21" fill="#17334a" font-weight="400">同一个时间 t</text><text x="44" y="198" font-size="21" fill="#17334a" font-weight="400">两条分支用同一套权重</text><rect x="420" y="95" width="250" height="82" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="434" y="125" font-size="21" fill="#17334a" font-weight="400">空提示／无条件分支</text><text x="434" y="154" font-size="21" fill="#17334a" font-weight="400">预测 ε<tspan baseline-shift="sub" font-size="70%">u</tspan></text><rect x="420" y="225" width="250" height="82" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="434" y="255" font-size="21" fill="#17334a" font-weight="400">目标提示／条件分支</text><text x="434" y="284" font-size="21" fill="#17334a" font-weight="400">预测 ε<tspan baseline-shift="sub" font-size="70%">c</tspan></text><path d="M320 150L408 136" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M320 177L408 266" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M680 136L755 190" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M680 266L755 216" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="765" y="155" width="205" height="105" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="779" y="185" font-size="21" fill="#17334a" font-weight="400">组合两种预测</text><text x="779" y="214" font-size="21" fill="#17334a" font-weight="400">交给调度器</text><text x="779" y="243" font-size="21" fill="#17334a" font-weight="400">计算下一状态</text><text x="30" y="380" font-size="30" fill="#307f82" font-weight="400">ε̂ = ε<tspan baseline-shift="sub" font-size="70%">u</tspan> + s · (ε<tspan baseline-shift="sub" font-size="70%">c</tspan> − ε<tspan baseline-shift="sub" font-size="70%">u</tspan>)</text><text x="30" y="426" font-size="21" fill="#17334a" font-weight="400">常用尺度约定：s=0 无条件，s=1 条件预测，s&gt;1 沿条件差异方向外推。</text><text x="30" y="470" font-size="21" fill="#17334a" font-weight="400">空提示特征不是全零；较大尺度不保证更好，也可能带来过饱和或伪影。</text><text x="30" y="514" font-size="21" fill="#17334a" font-weight="400">批量实现：潜变量 [2B,4,64,64]，文本 [2B,77,768] → 拆分并组合回 B。</text><text x="30" y="556" font-size="17" fill="#536c80" font-weight="400">这里采用常见 Diffusers scale 约定；负面提示可更换基准条件，但不是严格的逻辑排除。</text></g></svg>