<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="595" viewBox="0 0 1000 595" role="img"><title>文字怎样影响去噪：视觉查询读取文本条件</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="595" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">文字怎样影响去噪：视觉查询读取文本条件</text><rect x="30" y="115" width="440" height="110" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="145" font-size="22" fill="#17334a" font-weight="400">视觉空间位置提供查询 Q</text><text x="44" y="174" font-size="22" fill="#17334a" font-weight="400">64×64 = 4096 个位置</text><text x="44" y="203" font-size="22" fill="#17334a" font-weight="400">特征 [B,4096,320]</text><rect x="530" y="115" width="440" height="110" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="544" y="145" font-size="22" fill="#17334a" font-weight="400">文字位置提供 K 和 V</text><text x="544" y="174" font-size="22" fill="#17334a" font-weight="400">上下文化特征 [B,77,768]</text><text x="544" y="203" font-size="22" fill="#17334a" font-weight="400">先投影 768 → 320</text><path d="M250 235L360 300" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M750 235L640 300" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="290" y="311" width="420" height="108" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="304" y="341" font-size="22" fill="#17334a" font-weight="400">匹配每个图像位置与文字位置</text><text x="304" y="370" font-size="22" fill="#17334a" font-weight="400">分数表（省略多头）：4096×77</text><text x="304" y="399" font-size="22" fill="#17334a" font-weight="400">按权重组合 V，返回视觉计算</text><text x="30" y="486" font-size="21" fill="#17334a" font-weight="400">不同空间位置可以取用不同文字信息；条件不是把文字画成像素贴到图上。</text><text x="30" y="530" font-size="21" fill="#17334a" font-weight="400">交叉注意力有助于条件交互，但不能仅凭某个权重保证属性、数量或关系正确。</text><text x="30" y="571" font-size="17" fill="#536c80" font-weight="400">以 SD 1.5 的第一个 64×64 层级为例；先用单组 Q/K/V 说明计算，省略多头拆分。</text></g></svg>