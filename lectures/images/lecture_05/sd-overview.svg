<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img"><title>Stable Diffusion 1.5：文字条件、潜空间迭代和像素解码</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="640" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">Stable Diffusion 1.5：文字条件、潜空间迭代和像素解码</text><text x="30" y="98" font-size="22" fill="#17334a" font-weight="600">文字分支：整段上下文化表示，不是 CLIP 整句检索向量</text><rect x="30" y="123" width="285" height="92" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="153" font-size="20" fill="#17334a" font-weight="400">提示词 → CLIP 分词器</text><text x="44" y="182" font-size="20" fill="#17334a" font-weight="400">[B,77] 编号</text><text x="44" y="211" font-size="20" fill="#17334a" font-weight="400">77 包含特殊与补齐位置</text><path d="M325 169L350 169" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="365" y="123" width="295" height="92" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="379" y="153" font-size="20" fill="#17334a" font-weight="400">CLIP 文本 Transformer</text><text x="379" y="182" font-size="20" fill="#17334a" font-weight="400">[B,77,768]</text><text x="379" y="211" font-size="20" fill="#17334a" font-weight="400">提供每个位置的条件特征</text><text x="30" y="291" font-size="22" fill="#17334a" font-weight="600">生成分支：从潜空间随机噪声出发，反复更新</text><rect x="30" y="319" width="300" height="90" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="349" font-size="21" fill="#17334a" font-weight="400">初始随机潜变量</text><text x="44" y="378" font-size="21" fill="#17334a" font-weight="400">[B,4,64,64]</text><path d="M339 365L352 365" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="358" y="319" width="300" height="90" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="372" y="349" font-size="21" fill="#17334a" font-weight="400">U-Net 预测噪声</text><text x="372" y="378" font-size="21" fill="#17334a" font-weight="400">[B,4,64,64]</text><path d="M667 365L680 365" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="686" y="319" width="300" height="90" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="700" y="349" font-size="21" fill="#17334a" font-weight="400">调度器更新潜变量</text><text x="700" y="378" font-size="21" fill="#17334a" font-weight="400">[B,4,64,64]</text><path d="M515 228V307" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="700" y="123" width="265" height="92" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="714" y="153" font-size="19" fill="#17334a" font-weight="400">时间步 t → 时间嵌入</text><text x="714" y="182" font-size="19" fill="#17334a" font-weight="400">[B,320] → [B,1280]</text><text x="714" y="211" font-size="19" fill="#17334a" font-weight="400">进入 U-Net 残差块</text><path d="M830 228V271H583V307" stroke="#307f82" fill="none" stroke-width="3" marker-end="url(#a)"/><path d="M830 420V451H175V420" stroke="#307f82" fill="none" stroke-width="3" marker-end="url(#a)"/><path d="M175 454L175 483" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><text x="195" y="480" font-size="17" fill="#17334a" font-weight="400">迭代结束后解码</text><rect x="30" y="493" width="430" height="105" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="523" font-size="20" fill="#17334a" font-weight="400">最终潜变量 / 0.18215 → VAE 解码器</text><text x="44" y="552" font-size="20" fill="#17334a" font-weight="400">[B,4,64,64] → [B,3,512,512]</text><path d="M470 543L505 543" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="520" y="493" width="445" height="105" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="534" y="523" font-size="20" fill="#17334a" font-weight="400">映射数值范围并转换为图像</text><text x="534" y="552" font-size="20" fill="#17334a" font-weight="400">通常保存为 HWC 的 uint8 RGB</text><text x="534" y="581" font-size="20" fill="#17334a" font-weight="400">输出图像，不是语言词表分数</text><text x="30" y="616" font-size="17" fill="#536c80" font-weight="400">图中 B 表示每个提示的样本数；CFG 可把 U-Net 前向的实际批量扩为 2B，后面单独展示。</text></g></svg>