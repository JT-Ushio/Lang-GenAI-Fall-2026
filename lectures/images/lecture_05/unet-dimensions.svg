<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="675" viewBox="0 0 1000 675" role="img"><title>U-Net：分辨率先降低再升高，跨层保留空间信息</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="675" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">U-Net：分辨率先降低再升高，跨层保留空间信息</text><rect x="30" y="105" width="320" height="78" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="135" font-size="20" fill="#17334a" font-weight="400">下行层级：64×64</text><text x="44" y="164" font-size="20" fill="#17334a" font-weight="400">[B,320,64,64]</text><rect x="650" y="105" width="320" height="78" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="664" y="135" font-size="20" fill="#17334a" font-weight="400">上行层级：64×64</text><text x="664" y="164" font-size="20" fill="#17334a" font-weight="400">[B,320,64,64]</text><path d="M361 144L638 144" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M190 187L190 207" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M810 207L810 187" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="215" width="320" height="78" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="245" font-size="20" fill="#17334a" font-weight="400">下行层级：32×32</text><text x="44" y="274" font-size="20" fill="#17334a" font-weight="400">[B,640,32,32]</text><rect x="650" y="215" width="320" height="78" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="664" y="245" font-size="20" fill="#17334a" font-weight="400">上行层级：32×32</text><text x="664" y="274" font-size="20" fill="#17334a" font-weight="400">[B,640,32,32]</text><path d="M361 254L638 254" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M190 297L190 317" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M810 317L810 297" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="325" width="320" height="78" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="355" font-size="20" fill="#17334a" font-weight="400">下行层级：16×16</text><text x="44" y="384" font-size="20" fill="#17334a" font-weight="400">[B,1280,16,16]</text><rect x="650" y="325" width="320" height="78" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="664" y="355" font-size="20" fill="#17334a" font-weight="400">上行层级：16×16</text><text x="664" y="384" font-size="20" fill="#17334a" font-weight="400">[B,1280,16,16]</text><path d="M361 364L638 364" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M190 407L190 427" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M810 427L810 407" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="435" width="320" height="78" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="465" font-size="20" fill="#17334a" font-weight="400">下行层级：8×8</text><text x="44" y="494" font-size="20" fill="#17334a" font-weight="400">[B,1280,8,8]</text><rect x="650" y="435" width="320" height="78" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="664" y="465" font-size="20" fill="#17334a" font-weight="400">上行层级：8×8</text><text x="664" y="494" font-size="20" fill="#17334a" font-weight="400">[B,1280,8,8]</text><path d="M361 474L638 474" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="375" y="435" width="250" height="78" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="389" y="465" font-size="20" fill="#17334a" font-weight="400">瓶颈／中间块</text><text x="389" y="494" font-size="20" fill="#17334a" font-weight="400">[B,1280,8,8]</text><path d="M361 474L363 474" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M635 474L638 474" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><text x="30" y="562" font-size="21" fill="#17334a" font-weight="400">跳跃连接：把相同分辨率的下行特征送到上行，帮助保留空间信息。</text><text x="30" y="606" font-size="21" fill="#17334a" font-weight="400">输入／输出均为 [B,4,64,64]；中间通道数改变，输出不直接是 RGB 图片。</text><text x="30" y="651" font-size="17" fill="#536c80" font-weight="400">展示代表性层级并省略块内多次残差与拼接；细部实现中拼接会暂时增加通道数。</text></g></svg>