<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img"><title>从图文对应，到语言条件下的图像生成</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="410" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">从图文对应，到语言条件下的图像生成</text><text x="30" y="107" font-size="23" fill="#17334a" font-weight="600">第三课 · CLIP</text><rect x="30" y="130" width="300" height="135" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="160" font-size="20" fill="#17334a" font-weight="400">图像与文字分别编码</text><text x="44" y="189" font-size="20" fill="#17334a" font-weight="400">比较已有候选的相似度</text><text x="44" y="218" font-size="20" fill="#17334a" font-weight="400">图文对齐</text><text x="358" y="107" font-size="23" fill="#17334a" font-weight="600">第四课 · 生成式 VLM</text><rect x="358" y="130" width="300" height="135" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="372" y="160" font-size="20" fill="#17334a" font-weight="400">图像＋问题作为条件</text><text x="372" y="189" font-size="20" fill="#17334a" font-weight="400">语言模型逐词元回答</text><text x="372" y="218" font-size="20" fill="#17334a" font-weight="400">图像 → 文字</text><text x="686" y="107" font-size="23" fill="#17334a" font-weight="600">第五课 · 条件扩散</text><rect x="686" y="130" width="300" height="135" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="700" y="160" font-size="20" fill="#17334a" font-weight="400">文字＋初始随机噪声</text><text x="700" y="189" font-size="20" fill="#17334a" font-weight="400">重复更新图像／潜变量</text><text x="700" y="218" font-size="20" fill="#17334a" font-weight="400">文字 → 图像</text><text x="30" y="337" font-size="22" fill="#17334a" font-weight="400">对应关系可以帮助生成，但不会自动提供“把向量画成图”的解码器。</text><text x="30" y="386" font-size="17" fill="#536c80" font-weight="400">本课讲经典 Stable Diffusion 1.5；用于说明机制与维度，不代表最新模型的统一架构。</text></g></svg>