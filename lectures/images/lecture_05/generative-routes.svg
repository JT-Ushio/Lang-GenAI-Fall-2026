<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img"><title>生成模型有多条路线：本课聚焦扩散</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="410" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">生成模型有多条路线：本课聚焦扩散</text><text x="30" y="100" font-size="23" fill="#17334a" font-weight="600">VAE：先压缩、再重建</text><rect x="30" y="130" width="280" height="98" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="160" font-size="20" fill="#17334a" font-weight="400">图像 → 连续潜变量</text><text x="44" y="189" font-size="20" fill="#17334a" font-weight="400">解码器重建图像</text><text x="44" y="218" font-size="20" fill="#17334a" font-weight="400">本课用于理解潜空间</text><text x="355" y="100" font-size="23" fill="#17334a" font-weight="600">GAN：生成与判别共同训练</text><rect x="355" y="130" width="290" height="98" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="369" y="160" font-size="20" fill="#17334a" font-weight="400">噪声 → 生成器 → 图像</text><text x="369" y="189" font-size="20" fill="#17334a" font-weight="400">判别器提供训练信号</text><text x="369" y="218" font-size="20" fill="#17334a" font-weight="400">本课只作历史对照</text><text x="690" y="100" font-size="23" fill="#17334a" font-weight="600">扩散：逐步生成</text><rect x="690" y="130" width="280" height="98" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="704" y="160" font-size="20" fill="#17334a" font-weight="400">训练：给样本加噪</text><text x="704" y="189" font-size="20" fill="#17334a" font-weight="400">学习预测噪声等目标</text><text x="704" y="218" font-size="20" fill="#17334a" font-weight="400">生成：多次更新样本</text><text x="30" y="298" font-size="21" fill="#17334a" font-weight="400">2015：扩散生成研究 → 2020：DDPM／DDIM → 2022：潜空间扩散与 CFG</text><text x="30" y="345" font-size="21" fill="#17334a" font-weight="400">这些路线可以组合：Stable Diffusion 将 VAE 压缩与条件扩散结合。</text><text x="30" y="386" font-size="17" fill="#536c80" font-weight="400">历史节点用于定位代表工作；DDPM 不是所有扩散生成研究的起点。</text></g></svg>