<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" role="img"><title>潜空间扩散：先学习压缩，再在较小表示上生成</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="535" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">潜空间扩散：先学习压缩，再在较小表示上生成</text><rect x="30" y="105" width="285" height="105" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="135" font-size="21" fill="#17334a" font-weight="400">RGB 图像／训练输入</text><text x="44" y="164" font-size="21" fill="#17334a" font-weight="400">[B,3,512,512]</text><text x="44" y="193" font-size="21" fill="#17334a" font-weight="400">VAE 编码器</text><path d="M325 158L350 158" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="365" y="105" width="295" height="105" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="379" y="135" font-size="21" fill="#17334a" font-weight="400">后验均值与对数方差</text><text x="379" y="164" font-size="21" fill="#17334a" font-weight="400">[B,8,64,64]</text><text x="379" y="193" font-size="21" fill="#17334a" font-weight="400">拆成两组 4 通道</text><path d="M670 158L695 158" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="710" y="105" width="255" height="105" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="724" y="135" font-size="20" fill="#17334a" font-weight="400">采样潜变量 z</text><text x="724" y="164" font-size="20" fill="#17334a" font-weight="400">[B,4,64,64]</text><text x="724" y="193" font-size="20" fill="#17334a" font-weight="400">幅值乘 0.18215</text><text x="30" y="281" font-size="22" fill="#17334a" font-weight="400">空间：512 → 64，宽与高各缩小 8 倍，位置数量变为 1/64。</text><text x="30" y="325" font-size="22" fill="#17334a" font-weight="400">元素：3×512×512 / (4×64×64) = 48；这不是图像文件压缩率。</text><rect x="30" y="386" width="425" height="82" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="416" font-size="20" fill="#17334a" font-weight="400">生成结束：先把潜变量幅值除以 0.18215</text><text x="44" y="445" font-size="20" fill="#17334a" font-weight="400">VAE 解码器再输出 RGB 像素</text><path d="M465 426L500 426" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="515" y="386" width="450" height="82" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="529" y="416" font-size="20" fill="#17334a" font-weight="400">[B,4,64,64] → [B,3,512,512]</text><text x="529" y="445" font-size="20" fill="#17334a" font-weight="400">4 个潜通道没有固定的 R/G/B/透明度含义</text><text x="30" y="511" font-size="17" fill="#536c80" font-weight="400">0.18215 是所选 SD 1.x 的幅值缩放；它不改变 shape，也不是空间缩放的 1/8。</text></g></svg>