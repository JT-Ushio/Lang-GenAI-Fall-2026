<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img"><title>前向扩散：怎样构造一个指定噪声水平的样本？</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="465" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">前向扩散：怎样构造一个指定噪声水平的样本？</text><rect x="30" y="115" width="280" height="110" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="145" font-size="21" fill="#17334a" font-weight="400">干净数据 x<tspan baseline-shift="sub" font-size="70%">0</tspan></text><text x="44" y="174" font-size="21" fill="#17334a" font-weight="400">固定加噪规则</text><text x="44" y="203" font-size="21" fill="#17334a" font-weight="400">混入标准高斯噪声 ε</text><path d="M320 170L355 170" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="370" y="115" width="260" height="110" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="384" y="145" font-size="21" fill="#17334a" font-weight="400">噪声水平随 t 改变</text><text x="384" y="174" font-size="21" fill="#17334a" font-weight="400">噪声样本 x<tspan baseline-shift="sub" font-size="70%">t</tspan></text><text x="384" y="203" font-size="21" fill="#17334a" font-weight="400">保留的信号越来越少</text><path d="M640 170L675 170" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="690" y="115" width="280" height="110" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="704" y="145" font-size="21" fill="#17334a" font-weight="400">很高噪声水平</text><text x="704" y="174" font-size="21" fill="#17334a" font-weight="400">主要呈现随机纹理</text><text x="704" y="203" font-size="21" fill="#17334a" font-weight="400">不能唯一反推原图</text><text x="30" y="305" font-size="29" fill="#307f82" font-weight="400">x<tspan baseline-shift="sub" font-size="70%">t</tspan> = √ᾱ<tspan baseline-shift="sub" font-size="70%">t</tspan> · x<tspan baseline-shift="sub" font-size="70%">0</tspan> + √(1 − ᾱ<tspan baseline-shift="sub" font-size="70%">t</tspan>) · ε</text><text x="30" y="353" font-size="22" fill="#17334a" font-weight="400">α<tspan baseline-shift="sub" font-size="70%">t</tspan> = 1 − β<tspan baseline-shift="sub" font-size="70%">t</tspan>，ᾱ<tspan baseline-shift="sub" font-size="70%">t</tspan> = α<tspan baseline-shift="sub" font-size="70%">1</tspan> × … × α<tspan baseline-shift="sub" font-size="70%">t</tspan>，ε 来自标准正态分布。</text><text x="30" y="398" font-size="21" fill="#17334a" font-weight="400">系数平方之和为 1；不是把原图与随机图直接按百分比混合。</text><text x="30" y="441" font-size="17" fill="#536c80" font-weight="400">代码数组从 0 开始；alpha_bar[0] 已是第一步加噪后，干净原图单独展示。</text></g></svg>