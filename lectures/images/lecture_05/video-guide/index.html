</main><script>const items=[{"id": "01_iterative-generation", "file": "01_iterative-generation.png", "timestamp_seconds": 95, "time": "01:35", "title": "从随机状态开始，重复更新", "lecture_section": "01／06", "talk": "先指出输入是随机噪声；网络给出更新所需的预测，经过多次更新才得到结构。", "caution": "本帧来自视频对 Wan 的介绍，骨干标为 Transformer；本课经典 SD 1.5 使用 U-Net，不能混用架构。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=95", "kind": "frame"}, {"id": "02_clip-encoders", "file": "02_clip-encoders.png", "timestamp_seconds": 256, "time": "04:16", "title": "复习 CLIP 的两个编码器", "lecture_section": "01", "talk": "文字和图片各自编码，再比较向量。这让模型能匹配描述，还没有自动获得把噪声画成图的生成网络。", "caution": "图中的 512 是视频所举 CLIP 检索表示；本课 SD 1.5 条件采用 77×768 的文本序列隐藏状态。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=256", "kind": "frame"}, {"id": "03_clip-pairing", "file": "03_clip-pairing.png", "timestamp_seconds": 308, "time": "05:08", "title": "批量图文配对与对比学习", "lecture_section": "01／课前复习", "talk": "按行看文本，按列看图像；配对的目标是让同一概念靠近，其他候选形成区分。", "caution": "这张表列的是配对的向量，不能直接把每格数字当成已经算好的相似度。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=308", "kind": "frame"}, {"id": "04_forward-noise", "file": "04_forward-noise.png", "timestamp_seconds": 520, "time": "08:40", "title": "加噪让图像结构逐渐消失", "lecture_section": "03", "talk": "沿左到右读：猫的细节越来越不明显，噪声越来越占主导；接着回到课堂的 RGB 加噪代码。", "caution": "这是视频的过程示意；具体信号和噪声系数以课件公式及代码为准。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=520", "kind": "frame"}, {"id": "05_reverse-generation", "file": "05_reverse-generation.png", "timestamp_seconds": 548, "time": "09:08", "title": "训练好后，从噪声朝图像更新", "lecture_section": "05／06", "talk": "沿箭头方向读生成链：当前状态送入网络，再执行采样更新。不同噪声水平重复使用同一套训练好的参数。", "caution": "多个网络图标表示多次调用，不表示每一步重新训练一个独立网络。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=548", "kind": "frame"}, {"id": "06_noise-target", "file": "06_noise-target.png", "timestamp_seconds": 662, "time": "11:02", "title": "训练目标是这次人为加入的噪声", "lecture_section": "04", "talk": "先找到黄色 ε，再找紫色网络预测：损失比较这两个量。干净图、时间和噪声可由程序构造训练样本。", "caution": "本课采用 ε 预测；预测原图或 velocity 的模型需要相应的目标与采样公式。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=662", "kind": "frame"}, {"id": "07_two-pixel-space", "file": "07_two-pixel-space.png", "timestamp_seconds": 748, "time": "12:28", "title": "两个像素，也能组成一个数据空间", "lecture_section": "06／拓展", "talk": "横轴记录第一个像素，纵轴记录第二个像素；一幅只有两个像素的图像变成平面上的一个点。", "caution": "二维平面是数据空间类比，不是原图的宽与高；真实图像每个标量都可能贡献一个维度。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=748", "kind": "frame"}, {"id": "08_score-field", "file": "08_score-field.png", "timestamp_seconds": 946, "time": "15:46", "title": "箭头场给出局部移动方向", "lecture_section": "06／拓展", "talk": "把螺旋上的黄点看成数据分布的样本，箭头表示在某个噪声水平下可参考的局部方向。", "caution": "score function 在这里指对数密度的梯度，不是 CLIP 的图文评分；不用本图替代完整采样公式。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=946", "kind": "frame"}, {"id": "09_ddpm-paths", "file": "09_ddpm-paths.png", "timestamp_seconds": 1103, "time": "18:23", "title": "DDPM 的随机采样路径", "lecture_section": "06", "talk": "每条彩色路径从随机状态出发；受控随机项会让轨迹弯折，最终样本落向学到的结构。", "caution": "单条轨迹不要求每一步肉眼更清晰，也不需要恢复某张预先指定的原图。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=1103", "kind": "frame"}, {"id": "10_ddpm-ddim", "file": "10_ddpm-ddim.png", "timestamp_seconds": 1415, "time": "23:35", "title": "同一训练目标，可以搭配不同采样路径", "lecture_section": "06", "talk": "比较左侧随机折线与右侧较平滑的路径，再说明网络预测和采样算法是两个层次。", "caution": "DDIM 的确定性需要 η=0 且初始噪声与条件给定；本帧不是两种算法优劣的受控质量评测。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=1415", "kind": "frame"}, {"id": "11_text-conditioning", "file": "11_text-conditioning.png", "timestamp_seconds": 1588, "time": "26:28", "title": "文字特征进入去噪模型", "lecture_section": "09", "talk": "上方文本编码器输出条件特征，下面的去噪模型在每次更新时读取条件。语言提供内容约束。", "caution": "视频本帧用 Transformer 作泛化示意；本课用 U-Net 内的交叉注意力讲 SD 1.5，不能照此图认定所有模型相同。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=1588", "kind": "frame"}, {"id": "12_conditional-distribution", "file": "12_conditional-distribution.png", "timestamp_seconds": 1644, "time": "27:24", "title": "类别条件挑选分布中的一部分", "lecture_section": "09／10", "talk": "先把整条螺旋看成数据集合，再想象不同颜色对应不同类别；给定条件改变的是希望生成哪部分样本。", "caution": "二维类别示意不等同于现实自然语言的全部语义，也不是实际像素坐标。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=1644", "kind": "frame"}, {"id": "13_cfg-vector", "file": "13_cfg-vector.png", "timestamp_seconds": 1806, "time": "30:06", "title": "CFG：使用两种预测的差异", "lecture_section": "10", "talk": "先读灰色无条件方向，再读黄色条件方向；绿色差向量表示条件带来的偏向，随后按尺度组合。", "caution": "视频用向量场 f 表示，课堂代码组合的是噪声预测 ε；符号和尺度约定应先对齐，不能机械抄符号。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=1806", "kind": "frame"}, {"id": "14_guidance-output", "file": "14_guidance-output.png", "timestamp_seconds": 1904, "time": "31:44", "title": "引导尺度会改变生成外观", "lecture_section": "10／11", "talk": "指出提示词、引导尺度和输出三个位置，讨论条件遵循、颜色、细节和多样性应分别评价。", "caution": "这张截图本身不能证明所有控制变量相同；严谨比较还要固定模型、采样器、步数和随机种子。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=1904", "kind": "frame"}, {"id": "a01_noise-to-generation", "gif": "a01_noise-to-generation.gif", "mp4": "a01_noise-to-generation.mp4", "poster": "a01_noise-to-generation-poster.png", "related_frame": "01_iterative-generation", "start_seconds": 113, "end_seconds": 125, "duration_seconds": 12, "start_time": "01:53", "end_time": "02:05", "title": "从噪声逐渐出现结构", "talk": "观察迭代中的可见结构，不展开 Wan 的视频骨干。", "caution": "片段中的结构与符号服务于视频讲解；本课固定 SD 1.5 配置和 ε 预测约定。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=113", "kind": "animation"}, {"id": "a02_forward-noising", "gif": "a02_forward-noising.gif", "mp4": "a02_forward-noising.mp4", "poster": "a02_forward-noising-poster.png", "related_frame": "04_forward-noise", "start_seconds": 512, "end_seconds": 520, "duration_seconds": 8, "start_time": "08:32", "end_time": "08:40", "title": "构造前向加噪链", "talk": "沿着图中加噪箭头解释，不把这段动画倒放当成训练好的生成模型。", "caution": "片段中的结构与符号服务于视频讲解；本课固定 SD 1.5 配置和 ε 预测约定。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=512", "kind": "animation"}, {"id": "a03_ddpm-ddim", "gif": "a03_ddpm-ddim.gif", "mp4": "a03_ddpm-ddim.mp4", "poster": "a03_ddpm-ddim-poster.png", "related_frame": "10_ddpm-ddim", "start_seconds": 1408, "end_seconds": 1416, "duration_seconds": 8, "start_time": "23:28", "end_time": "23:36", "title": "DDPM／DDIM 采样路径对照", "talk": "路径规则可以不同；本段只解释形态，不据此宣称哪种质量一定更好。", "caution": "片段中的结构与符号服务于视频讲解；本课固定 SD 1.5 配置和 ε 预测约定。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=1408", "kind": "animation"}, {"id": "a04_cfg-path", "gif": "a04_cfg-path.gif", "mp4": "a04_cfg-path.mp4", "poster": "a04_cfg-path-poster.png", "related_frame": "13_cfg-vector", "start_seconds": 1815, "end_seconds": 1823, "duration_seconds": 8, "start_time": "30:15", "end_time": "30:23", "title": "沿条件偏向更新状态", "talk": "暂停在一个箭头处，说明网络给预测、采样器更新状态；接回课件 CFG 小算例。", "caution": "片段中的结构与符号服务于视频讲解；本课固定 SD 1.5 配置和 ε 预测约定。", "source_url": "https://www.bilibili.com/video/BV1Z9ec69Ezz/?t=1815", "kind": "animation"}],$=id=>document.getElementById(id);let current=0;

function show(i){current=(i+items.length)%items.length;const r=items[current];$('select').value=current;$('title').textContent=`${current+1} / ${items.length} · ${r.title}`;$('talk').textContent=r.talk;$('caution').textContent=r.caution||'原视频动画片段；教学解释请与本课代码、采样器约定分别核对。';$('time').textContent=(r.kind==='frame'?`中文视频 ${r.time}；建议对应第 ${r.lecture_section} 节`:`中文视频 ${r.start_time}—${r.end_time}；${r.duration_seconds} 秒，无声`);$('animation-controls').hidden=r.kind!=='animation';showImage(r.kind==='frame'?r.file:r.poster);links(r);location.hash=r.id}
