<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img"><title>每次预测由网络给出，怎样迈下一步由采样规则决定</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="515" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">每次预测由网络给出，怎样迈下一步由采样规则决定</text><rect x="30" y="120" width="235" height="104" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="150" font-size="21" fill="#17334a" font-weight="400">当前样本 x<tspan baseline-shift="sub" font-size="70%">t</tspan></text><text x="44" y="179" font-size="21" fill="#17334a" font-weight="400">当前时间索引 t</text><text x="44" y="208" font-size="21" fill="#17334a" font-weight="400">文字／类别条件 c</text><path d="M275 172L307 172" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="320" y="120" width="235" height="104" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="334" y="150" font-size="20" fill="#17334a" font-weight="400">同一套去噪网络</text><text x="334" y="179" font-size="20" fill="#17334a" font-weight="400">预测当前噪声 ε̂</text><text x="334" y="208" font-size="20" fill="#17334a" font-weight="400">参数不随步骤重新训练</text><path d="M565 172L597 172" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="610" y="120" width="355" height="104" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="624" y="150" font-size="21" fill="#17334a" font-weight="400">调度器／采样器</text><text x="624" y="179" font-size="21" fill="#17334a" font-weight="400">结合时间与噪声预测</text><text x="624" y="208" font-size="21" fill="#17334a" font-weight="400">计算下一状态 x<tspan baseline-shift="sub" font-size="70%">t</tspan><tspan baseline-shift="sub" font-size="70%">−</tspan><tspan baseline-shift="sub" font-size="70%">1</tspan></text><path d="M790 237V290H140V237" stroke="#307f82" fill="none" stroke-width="3" marker-end="url(#a)"/><text x="30" y="365" font-size="21" fill="#17334a" font-weight="400">DDPM：常在反向步骤中注入受控随机噪声，最后一步通常不再加噪。</text><text x="30" y="407" font-size="21" fill="#17334a" font-weight="400">DDIM：η=0 时，给定初始噪声与条件可确定采样路径；η&gt;0 可引入随机性。</text><text x="30" y="449" font-size="21" fill="#17334a" font-weight="400">减少推理步数要用相应采样规则；不能简单漏掉循环中的任意若干步。</text><text x="30" y="491" font-size="17" fill="#536c80" font-weight="400">训练时间网格 T 与推理更新次数 K 是不同概念；本课微型例子用 100 步 DDPM。</text></g></svg>