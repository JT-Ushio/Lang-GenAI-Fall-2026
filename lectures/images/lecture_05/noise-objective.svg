<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img"><title>学习去噪：给出噪声图、时间和条件，预测噪声</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="465" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">学习去噪：给出噪声图、时间和条件，预测噪声</text><rect x="30" y="115" width="225" height="103" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="145" font-size="20" fill="#17334a" font-weight="400">随机取训练图 x<tspan baseline-shift="sub" font-size="70%">0</tspan></text><text x="44" y="174" font-size="20" fill="#17334a" font-weight="400">随机取时间索引 t</text><text x="44" y="203" font-size="20" fill="#17334a" font-weight="400">随机采样噪声 ε</text><path d="M265 166L292 166" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="305" y="115" width="235" height="103" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="319" y="145" font-size="20" fill="#17334a" font-weight="400">按公式合成 x<tspan baseline-shift="sub" font-size="70%">t</tspan></text><text x="319" y="174" font-size="20" fill="#17334a" font-weight="400">输入：x<tspan baseline-shift="sub" font-size="70%">t</tspan>、t、条件 c</text><text x="319" y="203" font-size="20" fill="#17334a" font-weight="400">同一个网络处理各 t</text><path d="M550 166L577 166" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="590" y="115" width="195" height="103" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="604" y="145" font-size="20" fill="#17334a" font-weight="400">去噪网络 ε<tspan baseline-shift="sub" font-size="70%">θ</tspan></text><text x="604" y="174" font-size="20" fill="#17334a" font-weight="400">预测噪声 ε̂</text><text x="604" y="203" font-size="20" fill="#17334a" font-weight="400">输出形状同 x<tspan baseline-shift="sub" font-size="70%">t</tspan></text><path d="M795 166L817 166" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="830" y="115" width="140" height="103" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="844" y="145" font-size="19" fill="#17334a" font-weight="400">和 ε 比较</text><text x="844" y="174" font-size="19" fill="#17334a" font-weight="400">MSE 损失</text><text x="844" y="203" font-size="19" fill="#17334a" font-weight="400">更新参数</text><text x="30" y="301" font-size="29" fill="#307f82" font-weight="400">L = mean((ε<tspan baseline-shift="sub" font-size="70%">θ</tspan>(x<tspan baseline-shift="sub" font-size="70%">t</tspan>, t, c) − ε)²)</text><text x="30" y="351" font-size="21" fill="#17334a" font-weight="400">监督目标是这次人为采样的噪声；目标可计算，不需要人手标注每一张“去噪图”。</text><text x="30" y="398" font-size="21" fill="#17334a" font-weight="400">训练常随机抽一个噪声水平；不必每条数据都先跑完整个反向采样链。</text><text x="30" y="441" font-size="17" fill="#536c80" font-weight="400">这是 epsilon 预测的常见简化目标；其他扩散模型也可能预测原样本或 velocity。</text></g></svg>