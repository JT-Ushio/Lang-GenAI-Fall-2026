<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img"><title>语言很流畅，不意味着回答真的有图像依据</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="505" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">语言很流畅，不意味着回答真的有图像依据</text><rect x="30" y="100" width="445" height="286" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="130" font-size="23" fill="#17334a" font-weight="400">可见证据</text><text x="44" y="159" font-size="23" fill="#17334a" font-weight="400">左边：红方块</text><text x="44" y="188" font-size="23" fill="#17334a" font-weight="400">右边：蓝圆形</text><text x="44" y="217" font-size="23" fill="#17334a" font-weight="400">展签：1280 年</text><text x="44" y="246" font-size="23" fill="#17334a" font-weight="400">图中没有汽车</text><rect x="525" y="100" width="445" height="126" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="539" y="130" font-size="22" fill="#17334a" font-weight="400">可核对的回答</text><text x="539" y="159" font-size="22" fill="#17334a" font-weight="400">『展签写着 1280 年。』</text><text x="539" y="188" font-size="22" fill="#17334a" font-weight="400">『图中未见汽车。』</text><rect x="525" y="252" width="445" height="134" rx="14" fill="#ffe9e5" stroke="#9ab9c1"/><text x="539" y="282" font-size="22" fill="#17334a" font-weight="400">需要警惕的回答</text><text x="539" y="311" font-size="22" fill="#17334a" font-weight="400">『这辆红色汽车……』</text><text x="539" y="340" font-size="22" fill="#17334a" font-weight="400">『展品一定来自某位收藏家。』</text><text x="30" y="440" font-size="23" fill="#17334a" font-weight="600">事实正确／关系正确／证据充分／语言自然：分别检查。</text><text x="30" y="481" font-size="17" fill="#536c80" font-weight="400">上面是教师构造的正反例；不得把示例当作对某个真实模型的测试结果。</text></g></svg>