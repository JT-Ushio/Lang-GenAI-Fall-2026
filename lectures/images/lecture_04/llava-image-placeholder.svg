<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img"><title>图像占位符不是普通词：先定位，再替换为视觉向量</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="690" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">图像占位符不是普通词：先定位，再替换为视觉向量</text><text x="30" y="98" font-size="22" fill="#17334a" font-weight="600">原始编号序列：20 个普通词元，加 1 个图像占位符</text><rect x="30" y="132" width="240" height="86" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="162" font-size="21" fill="#17334a" font-weight="400">前 3 个普通词元</text><text x="44" y="191" font-size="21" fill="#17334a" font-weight="400">[B,3,4096]</text><rect x="300" y="132" width="265" height="86" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="314" y="162" font-size="21" fill="#17334a" font-weight="400">&lt;image&gt; → -200</text><text x="314" y="191" font-size="21" fill="#17334a" font-weight="400">是插入位置标记</text><rect x="595" y="132" width="370" height="86" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="609" y="162" font-size="21" fill="#17334a" font-weight="400">后 17 个普通词元</text><text x="609" y="191" font-size="21" fill="#17334a" font-weight="400">[B,17,4096]</text><path d="M430 229L430 297" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="300" y="307" width="265" height="91" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="314" y="337" font-size="21" fill="#17334a" font-weight="400">576 个视觉块向量</text><text x="314" y="366" font-size="21" fill="#17334a" font-weight="400">[B,576,4096]</text><text x="30" y="469" font-size="24" fill="#17334a" font-weight="600">新嵌入序列：3 ＋ 576 ＋ 17 = 596 个位置</text><rect x="30" y="500" width="240" height="80" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="530" font-size="21" fill="#17334a" font-weight="400">文字前缀</text><text x="44" y="559" font-size="21" fill="#17334a" font-weight="400">3 个位置</text><rect x="300" y="500" width="265" height="80" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="314" y="530" font-size="21" fill="#17334a" font-weight="400">视觉向量</text><text x="314" y="559" font-size="21" fill="#17334a" font-weight="400">576 个位置</text><rect x="595" y="500" width="370" height="80" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="609" y="530" font-size="21" fill="#17334a" font-weight="400">文字后缀</text><text x="609" y="559" font-size="21" fill="#17334a" font-weight="400">17 个位置</text><text x="30" y="633" font-size="21" fill="#17334a" font-weight="400">labels 的图像位置设为 -100；批量对齐的补齐位置还需要 attention mask。</text><text x="30" y="666" font-size="17" fill="#536c80" font-weight="400">-200 不能直接送入普通 Embedding 查表；本图按原始 LLaVA 实现说明，其他库格式可不同。</text></g></svg>