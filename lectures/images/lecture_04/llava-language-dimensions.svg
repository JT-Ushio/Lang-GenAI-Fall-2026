<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img"><title>展开连接器与语言分支：宽度改变，位置数量怎样保持？</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="680" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">展开连接器与语言分支：宽度改变，位置数量怎样保持？</text><rect x="30" y="111" width="445" height="119" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="44" y="141" font-size="21" fill="#17334a" font-weight="400">MLP 连接器：逐块计算</text><text x="44" y="170" font-size="21" fill="#17334a" font-weight="400">Linear 1024→4096 → GELU</text><text x="44" y="199" font-size="21" fill="#17334a" font-weight="400">Linear 4096→4096</text><rect x="520" y="111" width="445" height="119" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="534" y="141" font-size="21" fill="#17334a" font-weight="400">输入和输出的位置数量相同</text><text x="534" y="170" font-size="21" fill="#17334a" font-weight="400">[B,576,1024] → [B,576,4096]</text><text x="534" y="199" font-size="21" fill="#17334a" font-weight="400">不是把整图向量复制 576 次</text><path d="M485 173L510 173" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="294" font-size="22" fill="#17334a" font-weight="600">一个 Vicuna/LLaMA 语言块（共 32 个；S 是拼接后的长度）</text><rect x="30" y="326" width="445" height="157" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="356" font-size="21" fill="#17334a" font-weight="400">RMSNorm → 因果注意力 → 残差</text><text x="44" y="385" font-size="21" fill="#17334a" font-weight="400">32 个头，每头 128 维</text><text x="44" y="414" font-size="21" fill="#17334a" font-weight="400">Q/K/V：[B,32,S,128]</text><text x="44" y="443" font-size="21" fill="#17334a" font-weight="400">输出：[B,S,4096]</text><rect x="520" y="326" width="445" height="157" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="534" y="356" font-size="21" fill="#17334a" font-weight="400">RMSNorm → 门控前馈 → 残差</text><text x="534" y="385" font-size="21" fill="#17334a" font-weight="400">gate/up：4096→11008</text><text x="534" y="414" font-size="21" fill="#17334a" font-weight="400">SiLU(gate) × up → down</text><text x="534" y="443" font-size="21" fill="#17334a" font-weight="400">down：11008→4096</text><path d="M485 404L510 404" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="537" width="445" height="80" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="567" font-size="21" fill="#17334a" font-weight="400">32 层后再归一化</text><text x="44" y="596" font-size="21" fill="#17334a" font-weight="400">隐藏状态：[B,S,4096]</text><path d="M485 578L510 578" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="520" y="537" width="445" height="80" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="534" y="567" font-size="21" fill="#17334a" font-weight="400">输出头：4096→32000</text><text x="534" y="596" font-size="21" fill="#17334a" font-weight="400">logits：[B,S,32000]</text><text x="30" y="656" font-size="17" fill="#536c80" font-weight="400">MLP=多层感知机；RMSNorm=均方根归一化；SiLU/GELU 为非线性变换。</text></g></svg>