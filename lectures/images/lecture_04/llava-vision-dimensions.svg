<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>展开视觉分支：336 像素怎样变成 576 个向量？</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="660" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">展开视觉分支：336 像素怎样变成 576 个向量？</text><rect x="30" y="110" width="290" height="97" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="140" font-size="20" fill="#17334a" font-weight="400">卷积切块：核 14，步幅 14</text><text x="44" y="169" font-size="20" fill="#17334a" font-weight="400">3 → 1024 通道</text><text x="44" y="198" font-size="20" fill="#17334a" font-weight="400">[B,1024,24,24]</text><path d="M330 160L352 160" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="365" y="110" width="295" height="97" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="379" y="140" font-size="20" fill="#17334a" font-weight="400">展平空间＋换轴</text><text x="379" y="169" font-size="20" fill="#17334a" font-weight="400">576 个块，每块 1024 维</text><text x="379" y="198" font-size="20" fill="#17334a" font-weight="400">[B,576,1024]</text><path d="M670 160L692 160" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="705" y="110" width="260" height="97" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="719" y="140" font-size="20" fill="#17334a" font-weight="400">加入 CLS＋位置嵌入</text><text x="719" y="169" font-size="20" fill="#17334a" font-weight="400">576 ＋ 1 = 577</text><text x="719" y="198" font-size="20" fill="#17334a" font-weight="400">[B,577,1024]</text><text x="30" y="271" font-size="23" fill="#17334a" font-weight="600">一个视觉 Transformer 块（共 24 个）</text><rect x="30" y="300" width="450" height="160" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="330" font-size="21" fill="#17334a" font-weight="400">LayerNorm → 自注意力 → 残差</text><text x="44" y="359" font-size="21" fill="#17334a" font-weight="400">16 个头，每头 64 维</text><text x="44" y="388" font-size="21" fill="#17334a" font-weight="400">Q/K/V：[B,16,577,64]</text><text x="44" y="417" font-size="21" fill="#17334a" font-weight="400">组合输出：[B,577,1024]</text><rect x="520" y="300" width="445" height="160" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="534" y="330" font-size="21" fill="#17334a" font-weight="400">LayerNorm → 前馈网络 → 残差</text><text x="534" y="359" font-size="21" fill="#17334a" font-weight="400">1024 → 4096 → 1024</text><text x="534" y="388" font-size="21" fill="#17334a" font-weight="400">中间：[B,577,4096]</text><text x="534" y="417" font-size="21" fill="#17334a" font-weight="400">块输出：[B,577,1024]</text><path d="M488 380L510 380" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="515" width="450" height="82" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="545" font-size="20" fill="#17334a" font-weight="400">所选配置 hidden_states[-2]</text><text x="44" y="574" font-size="20" fill="#17334a" font-weight="400">24 层模型中对应第 23 个块后的状态</text><path d="M490 557L510 557" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="520" y="515" width="445" height="82" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="534" y="545" font-size="20" fill="#17334a" font-weight="400">去掉 CLS，留下 576 个块向量</text><text x="534" y="574" font-size="20" fill="#17334a" font-weight="400">[B,576,1024] → 连接器</text><text x="30" y="636" font-size="17" fill="#536c80" font-weight="400">图中不经过 CLIP 的整图池化与检索投影头；取中间层块特征供 LLaVA 使用。</text></g></svg>