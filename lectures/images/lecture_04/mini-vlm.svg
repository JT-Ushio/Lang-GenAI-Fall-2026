<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>课堂微型 VLM：真正做一次条件生成训练</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">课堂微型 VLM：真正做一次条件生成训练</text><text x="30" y="98" font-size="22" fill="#17334a" font-weight="600">输入：3 × 8 × 16 像素</text><rect x="30" y="124" width="130" height="105" fill="#e95f59"/><rect x="160" y="124" width="130" height="105" fill="#358ac8"/><text x="65" y="261" font-size="20" fill="#17334a" font-weight="400">左 red</text><text x="193" y="261" font-size="20" fill="#17334a" font-weight="400">右 blue</text><path d="M300 177L343 177" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="355" y="125" width="255" height="103" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="369" y="155" font-size="20" fill="#17334a" font-weight="400">局部切块嵌入</text><text x="369" y="184" font-size="20" fill="#17334a" font-weight="400">2 个 16 维特征</text><text x="369" y="213" font-size="20" fill="#17334a" font-weight="400">投影为 2 × 32</text><path d="M620 177L662 177" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="674" y="125" width="295" height="103" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="688" y="155" font-size="20" fill="#17334a" font-weight="400">拼入问题与答案前文</text><text x="688" y="184" font-size="20" fill="#17334a" font-weight="400">2 层因果 Transformer</text><text x="688" y="213" font-size="20" fill="#17334a" font-weight="400">7 个词元的输出词表</text><rect x="30" y="334" width="435" height="75" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="364" font-size="20" fill="#17334a" font-weight="400">同图换问题：left? → red &lt;eos&gt;</text><text x="44" y="393" font-size="20" fill="#17334a" font-weight="400">同图换问题：right? → blue &lt;eos&gt;</text><rect x="505" y="334" width="465" height="75" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="519" y="364" font-size="20" fill="#17334a" font-weight="400">交换两块颜色，再问 left?</text><text x="519" y="393" font-size="20" fill="#17334a" font-weight="400">应输出 blue &lt;eos&gt;</text><text x="30" y="446" font-size="17" fill="#536c80" font-weight="400">全部 8 种组合用于拟合；不是自然图像理解、真实预训练 VLM 或独立泛化评测。</text></g></svg>