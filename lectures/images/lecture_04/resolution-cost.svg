<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img"><title>分辨率、视觉词元与计算：更清晰需要付出什么？</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="490" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">分辨率、视觉词元与计算：更清晰需要付出什么？</text><text x="30" y="97" font-size="23" fill="#17334a" font-weight="600">小字与多图：细节增加，序列也会变长</text><rect x="30" y="123" width="285" height="100" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="153" font-size="21" fill="#17334a" font-weight="400">224×224 像素</text><text x="44" y="182" font-size="21" fill="#17334a" font-weight="400">14×14 像素一个块</text><text x="44" y="211" font-size="21" fill="#17334a" font-weight="400">256 个视觉块</text><rect x="355" y="123" width="285" height="100" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="369" y="153" font-size="21" fill="#17334a" font-weight="400">336×336 像素</text><text x="369" y="182" font-size="21" fill="#17334a" font-weight="400">14×14 像素一个块</text><text x="369" y="211" font-size="21" fill="#17334a" font-weight="400">576 个视觉块</text><rect x="680" y="123" width="285" height="100" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="694" y="153" font-size="21" fill="#17334a" font-weight="400">448×448 像素</text><text x="694" y="182" font-size="21" fill="#17334a" font-weight="400">14×14 像素一个块</text><text x="694" y="211" font-size="21" fill="#17334a" font-weight="400">1024 个视觉块</text><text x="30" y="294" font-size="22" fill="#17334a" font-weight="400">简单切块：宽高各增加一倍 → 图像块数量变为四倍。</text><text x="30" y="339" font-size="22" fill="#17334a" font-weight="400">完整自注意力的分数表随序列长度的平方增长。</text><text x="30" y="384" font-size="21" fill="#17334a" font-weight="400">实践中可用缩放、裁块、动态分辨率、重采样或压缩来控制成本。</text><text x="30" y="429" font-size="21" fill="#17334a" font-weight="400">视频还需时间顺序；多张图片的集合不能完整表达运动过程。</text><text x="30" y="466" font-size="17" fill="#536c80" font-weight="400">这里只计算整除尺寸的普通网格；实际模型可增加特殊词元、拼图或合并图像块。</text></g></svg>