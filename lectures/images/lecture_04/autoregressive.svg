<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="595" viewBox="0 0 1000 595" role="img"><title>自回归生成与教师强制：下一词元从哪里来？</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="595" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">自回归生成与教师强制：下一词元从哪里来？</text><text x="30" y="100" font-size="22" fill="#17334a" font-weight="600">先编码图像，再逐词元生成答案</text><rect x="30" y="130" width="285" height="92" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="160" font-size="21" fill="#17334a" font-weight="400">图像 I ＋ 问题 Q</text><text x="44" y="189" font-size="21" fill="#17334a" font-weight="400">始终作为条件上下文</text><rect x="355" y="132" width="143" height="90" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="369" y="162" font-size="18" fill="#17334a" font-weight="400">预测：a</text><text x="369" y="191" font-size="18" fill="#17334a" font-weight="400">起始标记</text><path d="M500 177L508 177" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="509" y="132" width="143" height="90" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="523" y="162" font-size="18" fill="#17334a" font-weight="400">预测：red</text><text x="523" y="191" font-size="18" fill="#17334a" font-weight="400">a</text><path d="M654 177L662 177" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="663" y="132" width="143" height="90" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="677" y="162" font-size="18" fill="#17334a" font-weight="400">预测：square</text><text x="677" y="191" font-size="18" fill="#17334a" font-weight="400">a red</text><path d="M808 177L816 177" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="817" y="132" width="143" height="90" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="831" y="162" font-size="18" fill="#17334a" font-weight="400">预测：&lt;eos&gt;</text><text x="831" y="191" font-size="18" fill="#17334a" font-weight="400">a red square</text><path d="M319 177L346 177" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="355" y="247" font-size="18" fill="#17334a" font-weight="400">卡片第二行显示已给出的答案前文。</text><text x="30" y="295" font-size="22" fill="#17334a" font-weight="600">训练：输入正确前文，在多个位置同时计算预测</text><text x="30" y="350" font-size="20" fill="#17334a" font-weight="400">已知前文</text><text x="30" y="425" font-size="20" fill="#17334a" font-weight="400">目标词元</text><rect x="175" y="320" width="177" height="51" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="189" y="350" font-size="21" fill="#17334a" font-weight="400">&lt;bos&gt;</text><path d="M263 377L263 395" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="175" y="402" width="177" height="51" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="189" y="432" font-size="21" fill="#17334a" font-weight="400">a</text><rect x="375" y="320" width="177" height="51" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="389" y="350" font-size="21" fill="#17334a" font-weight="400">a</text><path d="M463 377L463 395" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="375" y="402" width="177" height="51" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="389" y="432" font-size="21" fill="#17334a" font-weight="400">red</text><rect x="575" y="320" width="177" height="51" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="589" y="350" font-size="21" fill="#17334a" font-weight="400">red</text><path d="M663 377L663 395" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="575" y="402" width="177" height="51" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="589" y="432" font-size="21" fill="#17334a" font-weight="400">square</text><rect x="775" y="320" width="177" height="51" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="789" y="350" font-size="21" fill="#17334a" font-weight="400">square</text><path d="M863 377L863 395" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="775" y="402" width="177" height="51" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="789" y="432" font-size="21" fill="#17334a" font-weight="400">&lt;eos&gt;</text><text x="30" y="507" font-size="26" fill="#307f82" font-weight="400">p(A | I, Q) = ∏ₜ p(aₜ | I, Q, a₁,…,aₜ₋₁)</text><text x="30" y="543" font-size="20" fill="#17334a" font-weight="400">t 从 1 到 T：整段答案概率＝每一步条件概率的乘积。</text><text x="30" y="571" font-size="17" fill="#536c80" font-weight="400">训练可并行算各位置，但因果掩码仍禁止读取未来答案；推理通常逐词元展开。</text></g></svg>