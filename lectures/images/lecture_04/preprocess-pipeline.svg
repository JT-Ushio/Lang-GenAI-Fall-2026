<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>预处理做了两件事：整理空间尺寸，匹配数值分布</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">预处理做了两件事：整理空间尺寸，匹配数值分布</text><text x="30" y="95" font-size="22" fill="#17334a" font-weight="600">空间处理：把图片整理到模型训练时的输入格式</text><rect x="30" y="122" width="285" height="104" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="152" font-size="20" fill="#17334a" font-weight="400">读取文件</text><text x="44" y="181" font-size="20" fill="#17334a" font-weight="400">EXIF 转正／RGB</text><text x="44" y="210" font-size="20" fill="#17334a" font-weight="400">[H, W, 3]</text><rect x="355" y="122" width="285" height="104" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="369" y="152" font-size="20" fill="#17334a" font-weight="400">按配置补边与缩放</text><text x="369" y="181" font-size="20" fill="#17334a" font-weight="400">LLaVA-1.5：pad</text><text x="369" y="210" font-size="20" fill="#17334a" font-weight="400">[336, 336, 3]</text><rect x="680" y="122" width="285" height="104" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="694" y="152" font-size="20" fill="#17334a" font-weight="400">转浮点并除以 255</text><text x="694" y="181" font-size="20" fill="#17334a" font-weight="400">uint8 → float32</text><text x="694" y="210" font-size="20" fill="#17334a" font-weight="400">数值范围 [0, 1]</text><path d="M325 174L345 174" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M650 174L670 174" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="293" font-size="22" fill="#17334a" font-weight="600">数值处理：每个通道使用预训练处理器给定的常数</text><rect x="30" y="323" width="600" height="119" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="353" font-size="21" fill="#17334a" font-weight="400">标准化：z = (像素 / 255 − mean) / std</text><text x="44" y="382" font-size="21" fill="#17334a" font-weight="400">R/G/B 均值 ≈ [0.4815, 0.4578, 0.4082]</text><text x="44" y="411" font-size="21" fill="#17334a" font-weight="400">R/G/B 标准差 ≈ [0.2686, 0.2613, 0.2758]</text><path d="M640 384L670 384" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="680" y="323" width="285" height="119" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="694" y="353" font-size="20" fill="#17334a" font-weight="400">换轴 HWC → CHW</text><text x="694" y="382" font-size="20" fill="#17334a" font-weight="400">加入批量维 B</text><text x="694" y="411" font-size="20" fill="#17334a" font-weight="400">[B, 3, 336, 336]</text><text x="30" y="495" font-size="22" fill="#17334a" font-weight="400">缩放与标准化不是模型推理；标准化后的数可以为负，也可以大于 1。</text><text x="30" y="536" font-size="17" fill="#536c80" font-weight="400">常数来自所选 CLIP 处理器；不要随意换成其他模型均值，或把已经 [0,1] 的图再除以 255。</text></g></svg>