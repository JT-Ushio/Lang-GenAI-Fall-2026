<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img"><title>图像相同，任务与语言输出可以不同</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="465" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">图像相同，任务与语言输出可以不同</text><rect x="30" y="85" width="395" height="325" rx="14" fill="#fff9ed" stroke="#9ab9c1"/><text x="53" y="123" font-size="23" fill="#17334a" font-weight="600">同一张教学场景</text><rect x="80" y="168" width="105" height="105" fill="#e95f59"/><circle cx="310" cy="220" r="56" fill="#358ac8"/><text x="84" y="302" font-size="20" fill="#17334a" font-weight="400">左：红方块</text><text x="257" y="302" font-size="20" fill="#17334a" font-weight="400">右：蓝圆形</text><rect x="75" y="329" width="300" height="56" rx="14" fill="#fff" stroke="#9ab9c1"/><text x="89" y="359" font-size="20" fill="#17334a" font-weight="400">展签：1280 年 · 陶制品</text><rect x="475" y="83" width="495" height="73" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="489" y="113" font-size="20" fill="#17334a" font-weight="400">图像描述</text><text x="489" y="142" font-size="20" fill="#17334a" font-weight="400">左侧是红色方块，右侧是蓝色圆形。</text><rect x="475" y="168" width="495" height="73" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="489" y="198" font-size="20" fill="#17334a" font-weight="400">视觉问答</text><text x="489" y="227" font-size="20" fill="#17334a" font-weight="400">问：左边什么颜色？答：红色。</text><rect x="475" y="253" width="495" height="73" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="489" y="283" font-size="20" fill="#17334a" font-weight="400">OCR／文字读取</text><text x="489" y="312" font-size="20" fill="#17334a" font-weight="400">读出展签中的年份：1280。</text><rect x="475" y="338" width="495" height="73" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="489" y="368" font-size="20" fill="#17334a" font-weight="400">双语表达</text><text x="489" y="397" font-size="20" fill="#17334a" font-weight="400">The red square is on the left.</text><path d="M435 246L465 246" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="441" font-size="17" fill="#536c80" font-weight="400">场景与答案由教师设计；用于定义任务，不是任何真实模型的预测。</text></g></svg>