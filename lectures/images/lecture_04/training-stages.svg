<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="525" viewBox="0 0 1000 525" role="img"><title>LLaVA 两阶段训练：哪些模块在学习？</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="525" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">LLaVA 两阶段训练：哪些模块在学习？</text><text x="30" y="96" font-size="23" fill="#17334a" font-weight="600">阶段一：先学会连接</text><text x="535" y="96" font-size="23" fill="#17334a" font-weight="600">阶段二：再学会按要求回答</text><rect x="30" y="122" width="430" height="58" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="152" font-size="21" fill="#17334a" font-weight="400">图像—文字配对</text><rect x="30" y="207" width="430" height="58" rx="14" fill="#e9eef3" stroke="#9ab9c1"/><text x="44" y="237" font-size="21" fill="#17334a" font-weight="400">视觉编码器　·　冻结</text><path d="M245 267L245 276" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="279" width="430" height="58" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="44" y="309" font-size="21" fill="#17334a" font-weight="400">连接器　·　更新参数</text><path d="M245 339L245 348" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="351" width="430" height="58" rx="14" fill="#e9eef3" stroke="#9ab9c1"/><text x="44" y="381" font-size="21" fill="#17334a" font-weight="400">语言模型　·　冻结</text><rect x="535" y="122" width="430" height="58" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="549" y="152" font-size="21" fill="#17334a" font-weight="400">图像＋问题＋答案</text><rect x="535" y="207" width="430" height="58" rx="14" fill="#e9eef3" stroke="#9ab9c1"/><text x="549" y="237" font-size="21" fill="#17334a" font-weight="400">视觉编码器　·　冻结</text><path d="M750 267L750 276" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="535" y="279" width="430" height="58" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="549" y="309" font-size="21" fill="#17334a" font-weight="400">连接器　·　更新参数</text><path d="M750 339L750 348" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="535" y="351" width="430" height="58" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="549" y="381" font-size="21" fill="#17334a" font-weight="400">语言模型　·　更新参数</text><text x="30" y="466" font-size="21" fill="#17334a" font-weight="400">冻结参数 ≠ 停止所有梯度计算：梯度仍可穿过冻结的语言模型传到连接器。</text><text x="30" y="501" font-size="17" fill="#536c80" font-weight="400">这是所选 LLaVA 基线的方案；现代模型也可能解冻视觉分支或使用其他训练阶段。</text></g></svg>