<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="675" viewBox="0 0 1000 675" role="img"><title>LLaVA-1.5 7B：像素与文字汇合，再输出词表分数</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="675" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">LLaVA-1.5 7B：像素与文字汇合，再输出词表分数</text><text x="30" y="94" font-size="22" fill="#17334a" font-weight="600">图像分支：保留块级特征，投影到语言模型的宽度</text><rect x="30" y="122" width="218" height="90" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="152" font-size="20" fill="#17334a" font-weight="400">预处理像素</text><text x="44" y="181" font-size="20" fill="#17334a" font-weight="400">[1,3,336,336]</text><path d="M251 168L267 168" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="274" y="122" width="218" height="90" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="288" y="152" font-size="20" fill="#17334a" font-weight="400">ViT-L/14 · 24 层</text><text x="288" y="181" font-size="20" fill="#17334a" font-weight="400">含 CLS：577×1024</text><path d="M495 168L511 168" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="518" y="122" width="218" height="90" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="532" y="152" font-size="20" fill="#17334a" font-weight="400">选 -2 层，去 CLS</text><text x="532" y="181" font-size="20" fill="#17334a" font-weight="400">[1,576,1024]</text><path d="M739 168L755 168" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="762" y="122" width="218" height="90" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="776" y="152" font-size="20" fill="#17334a" font-weight="400">两层 MLP</text><text x="776" y="181" font-size="20" fill="#17334a" font-weight="400">[1,576,4096]</text><text x="30" y="288" font-size="22" fill="#17334a" font-weight="600">文字分支：图像占位符定位插入点；其他词元照常查嵌入</text><rect x="30" y="319" width="285" height="105" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="349" font-size="19" fill="#17334a" font-weight="400">原始文字输入：21 项</text><text x="44" y="378" font-size="19" fill="#17334a" font-weight="400">20 个普通词元＋&lt;image&gt;</text><text x="44" y="407" font-size="19" fill="#17334a" font-weight="400">嵌入：每个词元 4096 维</text><path d="M325 372L350 372" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="365" y="319" width="295" height="105" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="379" y="349" font-size="20" fill="#17334a" font-weight="400">用 576 个向量替换占位符</text><text x="379" y="378" font-size="20" fill="#17334a" font-weight="400">长度：21 − 1 ＋ 576</text><text x="379" y="407" font-size="20" fill="#17334a" font-weight="400">[1,596,4096]</text><path d="M870 223V275H512V309" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M670 372L695 372" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="710" y="319" width="255" height="105" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="724" y="349" font-size="20" fill="#17334a" font-weight="400">Vicuna 7B · 32 层</text><text x="724" y="378" font-size="20" fill="#17334a" font-weight="400">[1,596,4096]</text><text x="724" y="407" font-size="20" fill="#17334a" font-weight="400">各层保持序列形状</text><rect x="365" y="486" width="295" height="80" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="379" y="516" font-size="19" fill="#17334a" font-weight="400">文字输出头：4096→32000</text><text x="379" y="545" font-size="19" fill="#17334a" font-weight="400">训练 logits [1,596,32000]</text><path d="M835 432V526H670" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="613" font-size="21" fill="#17334a" font-weight="400">生成下一词元只取最后一个位置：[1,1,32000]；选出词元，再接回序列。</text><text x="30" y="651" font-size="17" fill="#536c80" font-weight="400">B=1；21 项是教学设定的序列长度，非某句自然语言的实测分词；不展示所有聊天模板细节。</text></g></svg>