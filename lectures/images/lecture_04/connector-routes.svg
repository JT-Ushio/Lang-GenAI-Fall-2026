<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img"><title>视觉与语言的连接：三条有代表性的路线</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="570" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">视觉与语言的连接：三条有代表性的路线</text><text x="30" y="109" font-size="23" fill="#17334a" font-weight="600">LLaVA · 拼接前缀</text><rect x="30" y="128" width="218" height="66" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="158" font-size="21" fill="#17334a" font-weight="400">视觉特征</text><path d="M250 161L268 161" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="274" y="128" width="218" height="66" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="288" y="158" font-size="21" fill="#17334a" font-weight="400">逐块投影</text><path d="M494 161L512 161" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="518" y="128" width="218" height="66" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="532" y="158" font-size="21" fill="#17334a" font-weight="400">与文字拼接</text><path d="M738 161L756 161" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="762" y="128" width="218" height="66" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="776" y="158" font-size="21" fill="#17334a" font-weight="400">因果语言模型</text><text x="30" y="256" font-size="23" fill="#17334a" font-weight="600">BLIP-2 · 查询压缩</text><rect x="30" y="275" width="218" height="66" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="305" font-size="21" fill="#17334a" font-weight="400">视觉特征</text><path d="M250 308L268 308" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="274" y="275" width="218" height="66" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="28