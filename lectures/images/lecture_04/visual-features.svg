<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img"><title>从一个整图摘要，到一串可被查询的视觉特征</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="490" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">从一个整图摘要，到一串可被查询的视觉特征</text><text x="30" y="98" font-size="23" fill="#17334a" font-weight="600">保留多个位置的表示</text><rect x="42" y="130" width="49" height="49" fill="#f4b2ab"/><rect x="94" y="130" width="49" height="49" fill="#f7d2a3"/><rect x="146" y="130" width="49" height="49" fill="#a6cde8"/><rect x="42" y="182" width="49" height="49" fill="#f7d2a3"/><rect x="94" y="182" width="49" height="49" fill="#a6cde8"/><rect x="146" y="182" width="49" height="49" fill="#f4b2ab"/><rect x="42" y="234" width="49" height="49" fill="#a6cde8"/><rect x="94" y="234" width="49" height="49" fill="#f4b2ab"/><rect x="146" y="234" width="49" height="49" fill="#f7d2a3"/><text x="35" y="319" font-size="20" fill="#17334a" font-weight="400">像素／图像块</text><path d="M211 209L257 209" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="270" y="146" width="235" height="125" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="284" y="176" font-size="21" fill="#17334a" font-weight="400">视觉编码器</text><text x="284" y="205" font-size="21" fill="#17334a" font-weight="400">局部＋上下文特征</text><text x="284" y="234" font-size="21" fill="#17334a" font-weight="400">每块一个向量</text><path d="M515 209L557 209" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M580 153l180 0 18 15-180 0Z" fill="#c8e9e6" stroke="#4d8c90"/><path d="M580 168l180 0 0 32-180 0Z" fill="#e5f3f2" stroke="#4d8c90"/><path d="M596 142l180 0 18 15-180 0Z" fill="#c8e9e6" stroke="#4d8c90"/><path d="M596 157l180 0 0 32-180 0Z" fill="#e5f3f2" stroke="#4d8c90"/><path d="M612 131l180 0 18 15-180 0Z" fill="#c8e9e6" stroke="#4d8c90"/><path d="M612 146l180 0 0 32-180 0Z" fill="#e5f3f2" stroke="#4d8c90"/><path d="M628 120l180 0 18 15-180 0Z" fill="#c8e9e6" stroke="#4d8c90"/><path d="M628 135l180 0 0 32-180 0Z" fill="#e5f3f2" stroke="#4d8c90"/><path d="M644 109l180 0 18 15-180 0Z" fill="#c8e9e6" stroke="#4d8c90"/><path d="M644 124l180 0 0 32-180 0Z" fill="#e5f3f2" stroke="#4d8c90"/><text x="587" y="280" font-size="21" fill="#17334a" font-weight="400">特征序列 N × Dv</text><text x="30" y="385" font-size="22" fill="#17334a" font-weight="400">用于匹配：可汇总为整图向量，再做相似度比较。</text><text x="30" y="428" font-size="22" fill="#17334a" font-weight="400">用于生成：常保留图像块序列，让答案利用不同区域。</text><text x="30" y="466" font-size="17" fill="#536c80" font-weight="400">特征不是人工物体标签；保留图像块也不保证每一处细节都能被正确读出。</text></g></svg>