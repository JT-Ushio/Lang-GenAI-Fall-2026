<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img"><title>读懂一个具体例子：LLaVA-1.5 7B 的数据形状</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="505" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">读懂一个具体例子：LLaVA-1.5 7B 的数据形状</text><rect x="30" y="103" width="255" height="96" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="133" font-size="20" fill="#17334a" font-weight="400">RGB 输入：336×336</text><text x="44" y="162" font-size="20" fill="#17334a" font-weight="400">块大小：14×14</text><text x="44" y="191" font-size="20" fill="#17334a" font-weight="400">24×24＝576 个块</text><path d="M295 151L330 151" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="342" y="103" width="265" height="96" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="356" y="133" font-size="20" fill="#17334a" font-weight="400">CLIP ViT-L/14</text><text x="356" y="162" font-size="20" fill="#17334a" font-weight="400">取中间层的块特征</text><text x="356" y="191" font-size="20" fill="#17334a" font-weight="400">[B, 576, 1024]</text><path d="M617 151L650 151" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="662" y="103" width="305" height="96" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="676" y="133" font-size="20" fill="#17334a" font-weight="400">MLP 连接器</text><text x="676" y="162" font-size="20" fill="#17334a" font-weight="400">1024 → 4096 → 4096</text><text x="676" y="191" font-size="20" fill="#17334a" font-weight="400">[B, 576, 4096]</text><path d="M820 210L820 267" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="287" width="300" height="80" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="317" font-size="20" fill="#17334a" font-weight="400">问题词元 → 嵌入</text><text x="44" y="346" font-size="20" fill="#17334a" font-weight="400">[B, L, 4096]</text><path d="M340 327L380 327" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="392" y="287" width="255" height="80" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="406" y="317" font-size="20" fill="#17334a" font-weight="400">拼接视觉与文字序列</text><text x="406" y="346" font-size="20" fill="#17334a" font-weight="400">长度：576 ＋ L</text><path d="M657 327L697 327" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="709" y="287" width="258" height="80" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="723" y="317" font-size="20" fill="#17334a" font-weight="400">Vicuna 7B 语言模型</text><text x="723" y="346" font-size="20" fill="#17334a" font-weight="400">输出文字词表的分数</text><path d="M820 267L520 267L520 282" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="432" font-size="22" fill="#17334a" font-weight="400">视觉块没有被强行翻译成单词；它们直接进入连续的嵌入空间。</text><text x="30" y="481" font-size="17" fill="#536c80" font-weight="400">数字对应此公开配置；原始 LLaVA 的连接器是线性层，其他 VLM 的配置可能不同。</text></g></svg>