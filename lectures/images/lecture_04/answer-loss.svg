<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>答案区监督：标签向右一位，预测向前对齐</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="620" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">答案区监督：标签向右一位，预测向前对齐</text><text x="30" y="95" font-size="23" fill="#17334a" font-weight="600">输入序列</text><rect x="30" y="122" width="148" height="56" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="152" font-size="20" fill="#17334a" font-weight="400">图像 1</text><text x="78" y="207" font-size="17" fill="#17334a" font-weight="400">位置 0</text><rect x="190" y="122" width="148" height="56" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="204" y="152" font-size="20" fill="#17334a" font-weight="400">图像 2</text><text x="238" y="207" font-size="17" fill="#17334a" font-weight="400">位置 1</text><rect x="350" y="122" width="148" height="56" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="364" y="152" font-size="20" fill="#17334a" font-weight="400">问题</text><text x="398" y="207" font-size="17" fill="#17334a" font-weight="400">位置 2</text><rect x="510" y="122" width="148" height="56" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="524" y="152" font-size="20" fill="#17334a" font-weight="400">&lt;bos&gt;</text><text x="558" y="207" font-size="17" fill="#17334a" font-weight="400">位置 3</text><rect x="670" y="122" width="148" height="56" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="684" y="152" font-size="20" fill="#17334a" font-weight="400">red</text><text x="718" y="207" font-size="17" fill="#17334a" font-weight="400">位置 4</text><rect x="830" y="122" width="148" height="56" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="844" y="152" font-size="20" fill="#17334a" font-weight="400">&lt;eos&gt;</text><text x="878" y="207" font-size="17" fill="#17334a" font-weight="400">位置 5</text><text x="30" y="263" font-size="23" fill="#17334a" font-weight="600">labels（与输入位置对齐）</text><rect x="30" y="288" width="148" height="56" rx="14" fill="#e9eef3" stroke="#9ab9c1"/><text x="44" y="318" font-size="20" fill="#17334a" font-weight="400">-100</text><rect x="190" y="288" width="148" height="56" rx="14" fill="#e9eef3" stroke="#9ab9c1"/><text x="204" y="318" font-size="20" fill="#17334a" font-weight="400">-100</text><rect x="350" y="288" width="148" height="56" rx="14" fill="#e9eef3" stroke="#9ab9c1"/><text x="364" y="318" font-size="20" fill="#17334a" font-weight="400">-100</text><rect x="510" y="288" width="148" height="56" rx="14" fill="#e9eef3" stroke="#9ab9c1"/><text x="524" y="318" font-size="20" fill="#17334a" font-weight="400">-100</text><rect x="670" y="288" width="148" height="56" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="684" y="318" font-size="20" fill="#17334a" font-weight="400">red</text><rect x="830" y="288" width="148" height="56" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="844" y="318" font-size="20" fill="#17334a" font-weight="400">&lt;eos&gt;</text><path d="M590 180L710 279" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M750 180L870 279" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="399" font-size="22" fill="#17334a" font-weight="400">位置 3 的 logits → 预测位置 4 的 red。</text><text x="30" y="439" font-size="22" fill="#17334a" font-weight="400">位置 4 的 logits → 预测位置 5 的 &lt;eos&gt;。</text><text x="30" y="479" font-size="21" fill="#17334a" font-weight="400">-100 只让该位置不计入损失；它仍可作为被注意的上下文。</text><text x="30" y="533" font-size="26" fill="#307f82" font-weight="400">L = − (1/T) ∑ₜ log p(aₜ | I, Q, a₁,…,aₜ₋₁)</text><text x="30" y="569" font-size="20" fill="#17334a" font-weight="400">t 从 1 到 T：只对需要监督的答案词元求平均。</text><text x="30" y="596" font-size="17" fill="#536c80" font-weight="400">这里只省略真实聊天模板与分词；多轮对话需要正确标出每个助手回答区间。</text></g></svg>