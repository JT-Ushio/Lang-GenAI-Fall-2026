<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img"><title>从『哪句话更匹配』到『怎样组织答案』</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="475" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">从『哪句话更匹配』到『怎样组织答案』</text><text x="30" y="96" font-size="23" fill="#17334a" font-weight="600">CLIP：比较已有候选</text><rect x="30" y="123" width="205" height="92" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="153" font-size="21" fill="#17334a" font-weight="400">图像 → 图像向量</text><text x="44" y="182" font-size="21" fill="#17334a" font-weight="400">候选 → 文本向量</text><path d="M245 169L285 169" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="295" y="123" width="260" height="92" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="309" y="153" font-size="21" fill="#17334a" font-weight="400">计算相似度</text><text x="309" y="182" font-size="21" fill="#17334a" font-weight="400">选出更匹配的候选</text><path d="M565 169L605 169" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="615" y="123" width="355" height="92" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="629" y="153" font-size="21" fill="#17334a" font-weight="400">『红色方块』分数高</text><text x="629" y="182" font-size="21" fill="#17334a" font-weight="400">输出受候选集合限制</text><text x="30" y="290" font-size="23" fill="#17334a" font-weight="600">本课的生成式 VLM：根据图像与问题续写答案</text><rect x="30" y="318" width="205" height="92" rx="14" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="348" font-size="21" fill="#17334a" font-weight="400">图像特征序列</text><text x="44" y="377" font-size="21" fill="#17334a" font-weight="400">问题：左边是什么？</text><path d="M245 364L285 364" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="295" y="318" width="260" height="92" rx="14" fill="#eaf1fa" stroke="#9ab9c1"/><text x="309" y="348" font-size="21" fill="#17334a" font-weight="400">连接器＋语言模型</text><text x="309" y="377" font-size="21" fill="#17334a" font-weight="400">每次预测下一个词元</text><path d="M565 364L605 364" stroke="#307f82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="615" y="318" width="355" height="92" rx="14" fill="#fff0da" stroke="#9ab9c1"/><text x="629" y="348" font-size="21" fill="#17334a" font-weight="400">『左边是一个红色方块。』</text><text x="629" y="377" font-size="21" fill="#17334a" font-weight="400">直到生成结束标记</text><text x="30" y="451" font-size="17" fill="#536c80" font-weight="400">VLM 是广义的视觉语言模型；CLIP 也属此类。本课聚焦能生成文本的 VLM。</text></g></svg>