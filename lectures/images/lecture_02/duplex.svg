<g font-family="sans-serif" fill="#17334a">
<text x="45" y="48" font-size="27" font-weight="bold">语音交互：方向与时间</text>
<text x="45" y="78" font-size="17">条带表示有效传递；全双工允许两个方向在时间上重叠。</text>
<g font-size="20"><text x="45" y="138">单工</text><text x="45" y="243">半双工</text><text x="45" y="353">全双工</text></g>
<g font-size="17"><text x="180" y="127">用户 → 系统</text><text x="180" y="165">系统 → 用户</text><text x="180" y="232">用户 → 系统</text><text x="180" y="270">系统 → 用户</text><text x="180" y="342">用户 → 系统</text><text x="180" y="380">系统 → 用户</text></g>
