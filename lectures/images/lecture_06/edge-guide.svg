<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"><title>实际提取结构条件：边缘不等于完整图像</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="480" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">实际提取结构条件：边缘不等于完整图像</text><text x="30" y="102" font-size="21" fill="#17334a" font-weight="400">原图</text><image x="30" y="125" width="235" height="235" href="data:image/png;base64,"/><text x="360" y="102" font-size="21" fill="#17334a" font-weight="400">Sobel 边缘（二值）</text><image x="360" y="125" width="235" height="235" href="data:image/png;base64,"/><text x="690" y="102" font-size="21" fill="#17334a" font-weight="400">改色图：结构相同</text><image x="690" y="125" width="235" height="235" href="data:image/png;base64,"/><text x="30" y="414" font-size="21" fill="#17334a" font-weight="400">相同轮廓可以对应不同颜色；结构输入只约束一部分信息，文字仍需补足要求。</text><text x="30" y="456" font-size="17" fill="#536c80" font-weight="400">灰度图 → Sobel 卷积 → 梯度幅值 → 阈值二值化。</text></g></svg>