<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img"><title>图生图：把原图放到生成过程的某个噪声起点</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="455" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">图生图：把原图放到生成过程的某个噪声起点</text><rect x="30" y="110" width="280" height="105" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="140" font-size="20" fill="#17334a" font-weight="400">原图 RGB</text><text x="44" y="169" font-size="20" fill="#17334a" font-weight="400">[B,3,512,512]</text><text x="44" y="198" font-size="20" fill="#17334a" font-weight="400">VAE 编码＋幅值缩放</text><path d="M320 162L350 162" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="365" y="110" width="270" height="105" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="379" y="140" font-size="20" fill="#17334a" font-weight="400">原图潜变量</text><text x="379" y="169" font-size="20" fill="#17334a" font-weight="400">[B,4,64,64]</text><text x="379" y="198" font-size="20" fill="#17334a" font-weight="400">选择起始噪声水平</text><path d="M645 162L675 162" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="690" y="110" width="280" height="105" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="704" y="140" font-size="20" fill="#17334a" font-weight="400">按目标提示去噪</text><text x="704" y="169" font-size="20" fill="#17334a" font-weight="400">采样器更新潜变量</text><text x="704" y="198" font-size="20" fill="#17334a" font-weight="400">VAE 解码得到新图</text><text x="30" y="300" font-size="21" fill="#17334a" font-weight="400">低噪声：通常保留更多原图信息；高噪声：允许更大变化，也更易丢失内容。</text><text x="30" y="345" font-size="21" fill="#17334a" font-weight="400">strength 决定起点；guidance scale 调节条件引导，它们不是同一个旋钮。</text><text x="30" y="390" font-size="21" fill="#17334a" font-weight="400">固定种子、模型和采样器，再比较强度；最终改动幅度不要求逐样本单调。</text><text x="30" y="431" font-size="17" fill="#536c80" font-weight="400">维度以经典 SD 1.5 的 512×512 情形为例；噪声水平由实际调度器决定。</text></g></svg>