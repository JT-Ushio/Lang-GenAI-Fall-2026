<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img"><title>真实算例：仅靠“保留得很好”不能证明编辑成功</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="475" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">真实算例：仅靠“保留得很好”不能证明编辑成功</text><text x="30" y="100" font-size="23" fill="#17334a" font-weight="600">不编辑</text><image x="30" y="123" width="200" height="200" href="data:image/png;base64,"/><text x="30" y="366" font-size="19" fill="#17334a" font-weight="400">区域外误差 0.0000</text><text x="30" y="402" font-size="19" fill="#17334a" font-weight="400">区域内目标误差 0.4433</text><text x="275" y="100" font-size="23" fill="#17334a" font-weight="600">整图改变</text><image x="275" y="123" width="200" height="200" href="data:image/png;base64,"/><text x="275" y="366" font-size="19" fill="#17334a" font-weight="400">区域外误差 0.1467</text><text x="275" y="402" font-size="19" fill="#17334a" font-weight="400">区域内目标误差 0.0000</text><text x="520" y="100" font-size="23" fill="#17334a" font-weight="600">仅目标区域</text><image x="520" y="123" width="200" height="200" href="data:image/png;base64,"/><text x="520" y="366" font-size="19" fill="#17334a" font-weight="400">区域外误差 0.0000</text><text x="520" y="402" font-size="19" fill="#17334a" font-weight="400">区域内目标误差 0.0000</text><text x="765" y="100" font-size="23" fill="#17334a" font-weight="600">柔化合成</text><image x="765" y="123" width="200" height="200" href="data:image/png;base64,"/><text x="765" y="366" font-size="19" fill="#17334a" font-weight="400">区域外误差 0.0032</text><text x="765" y="402" font-size="19" fill="#17334a" font-weight="400">区域内目标误差 0.0566</text><text x="30" y="451" font-size="17" fill="#536c80" font-weight="400">已知对齐目标时，可用像素误差分别检查编辑区域与保留区域。</text></g></svg>