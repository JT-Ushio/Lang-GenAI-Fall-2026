<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img"><title>IP-Adapter：把参考图变成可读的图像条件</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="555" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">IP-Adapter：把参考图变成可读的图像条件</text><rect x="30" y="112" width="440" height="100" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="142" font-size="21" fill="#17334a" font-weight="400">文本条件 [B,77,768]</text><text x="44" y="171" font-size="21" fill="#17334a" font-weight="400">为视觉查询提供文字 K、V</text><text x="44" y="200" font-size="21" fill="#17334a" font-weight="400">解释想要的内容</text><rect x="530" y="112" width="440" height="100" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="544" y="142" font-size="20" fill="#17334a" font-weight="400">参考图 → 图像编码器 → 适配器</text><text x="544" y="171" font-size="20" fill="#17334a" font-weight="400">提供额外的图像条件 K、V</text><text x="544" y="200" font-size="20" fill="#17334a" font-weight="400">图像词元数由具体版本决定</text><path d="M250 224L360 290" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M750 224L640 290" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="230" y="305" width="540" height="110" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="244" y="335" font-size="21" fill="#17334a" font-weight="400">视觉位置提供查询 Q</text><text x="244" y="364" font-size="21" fill="#17334a" font-weight="400">分别读取文本条件和图像条件，再组合</text><text x="244" y="393" font-size="21" fill="#17334a" font-weight="400">参考权重改变图像条件的影响程度</text><text x="30" y="490" font-size="21" fill="#17334a" font-weight="400">保留人物身份、复制某种风格和保留整张背景，是三个不同的要求。</text><text x="30" y="531" font-size="17" fill="#536c80" font-weight="400">以 SD 1.5 兼容分支解释解耦注意力思路；不固定所有 IP-Adapter 变体的词元数量。</text></g></svg>