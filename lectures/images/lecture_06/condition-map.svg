<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img"><title>四类控制方式：先看输入，再看信息进入哪里</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="555" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">四类控制方式：先看输入，再看信息进入哪里</text><text x="30" y="110" font-size="23" fill="#17334a" font-weight="600">图生图</text><rect x="30" y="130" width="440" height="100" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="160" font-size="21" fill="#17334a" font-weight="400">原图决定加噪起点</text><text x="44" y="189" font-size="21" fill="#17334a" font-weight="400">强度影响起始噪声水平</text><text x="530" y="110" font-size="23" fill="#17334a" font-weight="600">局部重绘</text><rect x="530" y="130" width="440" height="100" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="544" y="160" font-size="21" fill="#17334a" font-weight="400">遮罩指定允许区域</text><text x="544" y="189" font-size="21" fill="#17334a" font-weight="400">额外图像条件帮助补全</text><text x="30" y="275" font-size="23" fill="#17334a" font-weight="600">结构控制</text><rect x="30" y="295" width="440" height="100" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="325" font-size="21" fill="#17334a" font-weight="400">边缘／姿态／深度</text><text x="44" y="354" font-size="21" fill="#17334a" font-weight="400">空间特征注入去噪网络</text><text x="530" y="275" font-size="23" fill="#17334a" font-weight="600">参考图与编辑指令</text><rect x="530" y="295" width="440" height="100" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="544" y="325" font-size="21" fill="#17334a" font-weight="400">参考外观／身份特征</text><text x="544" y="354" font-size="21" fill="#17334a" font-weight="400">或训练模型理解修改要求</text><text x="30" y="490" font-size="22" fill="#17334a" font-weight="400">输入信息进入的位置不同，提供的约束与可保证的事情也不同。</text><text x="30" y="531" font-size="17" fill="#536c80" font-weight="400">遮罩限定区域，结构图约束几何，参考图提供外观，指令表达修改。</text></g></svg>