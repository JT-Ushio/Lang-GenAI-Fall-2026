<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img"><title>三条统一路线：统一在哪里，生成方式是什么</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="455" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">三条统一路线：统一在哪里，生成方式是什么</text><text x="30" y="105" font-size="21" fill="#17334a" font-weight="600">A · 自回归</text><rect x="30" y="125" width="300" height="145" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="155" font-size="20" fill="#17334a" font-weight="400">文字：预测下一个词元</text><text x="44" y="184" font-size="20" fill="#17334a" font-weight="400">图像：预测下一个视觉编号</text><text x="44" y="213" font-size="20" fill="#17334a" font-weight="400">例：Janus／Janus-Pro</text><text x="358" y="105" font-size="21" fill="#17334a" font-weight="600">B · 自回归＋离散掩码</text><rect x="358" y="125" width="300" height="145" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="372" y="155" font-size="20" fill="#17334a" font-weight="400">文字：顺序生成</text><text x="372" y="184" font-size="20" fill="#17334a" font-weight="400">图像：迭代补齐被遮盖词元</text><text x="372" y="213" font-size="20" fill="#17334a" font-weight="400">例：Show-o</text><text x="686" y="105" font-size="21" fill="#17334a" font-weight="600">C · 自回归＋连续流</text><rect x="686" y="125" width="300" height="145" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="700" y="155" font-size="20" fill="#17334a" font-weight="400">文字：顺序生成</text><text x="700" y="184" font-size="20" fill="#17334a" font-weight="400">图像：更新连续潜变量</text><text x="700" y="213" font-size="20" fill="#17334a" font-weight="400">例：BAGEL</text><text x="30" y="340" font-size="23" fill="#17334a" font-weight="400">共享上下文与建模主干，可以与不同的视觉输出方式并存。</text><text x="30" y="390" font-size="21" fill="#17334a" font-weight="400">统一不等于“全部自回归”，也不等于“所有任务只使用一个损失函数”。</text><text x="30" y="431" font-size="17" fill="#536c80" font-weight="400">离散编号对应分类分布，连续潜变量对应连续更新，两者需要各自的输出接口。</text></g></svg>