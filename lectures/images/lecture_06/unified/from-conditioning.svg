<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img"><title>从语言条件，到能看、能说、能画的模型</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="555" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">从语言条件，到能看、能说、能画的模型</text><text x="30" y="135" font-size="23" fill="#17334a" font-weight="600">视觉语言理解</text><rect x="300" y="110" width="660" height="100" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="314" y="140" font-size="21" fill="#17334a" font-weight="400">图像＋问题 → 文字</text><text x="314" y="169" font-size="21" fill="#17334a" font-weight="400">视觉特征进入语言模型</text><text x="30" y="265" font-size="23" fill="#17334a" font-weight="600">文字条件生成</text><rect x="300" y="240" width="660" height="100" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="314" y="270" font-size="21" fill="#17334a" font-weight="400">文字 → 条件特征 → 图像</text><text x="314" y="299" font-size="21" fill="#17334a" font-weight="400">语言提示影响视觉采样</text><text x="30" y="395" font-size="23" fill="#17334a" font-weight="600">理解与生成统一</text><rect x="300" y="370" width="660" height="100" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="314" y="400" font-size="21" fill="#17334a" font-weight="400">图文上下文 → 文字或图像</text><text x="314" y="429" font-size="21" fill="#17334a" font-weight="400">联合训练，共用核心建模能力</text><text x="30" y="531" font-size="17" fill="#536c80" font-weight="400">条件生成模型也包含语义信息；新增问题是如何联合建模理解与生成，并利用上下文。</text></g></svg>