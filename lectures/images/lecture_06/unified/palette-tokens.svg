<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img"><title>图像也能进入词元序列：固定调色板小例子</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="490" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">图像也能进入词元序列：固定调色板小例子</text><image x="35" y="125" width="230" height="230" href="data:image/png;base64,"/><text x="35" y="100" font-size="22" fill="#17334a" font-weight="400">4×4 图像：左红、右蓝</text><text x="355" y="150" font-size="30" fill="#17334a" font-weight="400">0 0 0 0</text><text x="355" y="200" font-size="30" fill="#17334a" font-weight="400">1 1 3 3</text><text x="355" y="250" font-size="30" fill="#17334a" font-weight="400">1 1 3 3</text><text x="355" y="300" font-size="30" fill="#17334a" font-weight="400">0 0 0 0</text><text x="355" y="105" font-size="22" fill="#17334a" font-weight="400">固定调色板编号</text><rect x="625" y="125" width="340" height="195" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="639" y="155" font-size="20" fill="#17334a" font-weight="400">0：背景 → 词元 14</text><text x="639" y="184" font-size="20" fill="#17334a" font-weight="400">1：红色 → 词元 15</text><text x="639" y="213" font-size="20" fill="#17334a" font-weight="400">2：绿色 → 词元 16</text><text x="639" y="242" font-size="20" fill="#17334a" font-weight="400">3：蓝色 → 词元 17</text><text x="639" y="271" font-size="20" fill="#17334a" font-weight="400">图像词元与文字词元分区</text><text x="35" y="420" font-size="22" fill="#17334a" font-weight="400">按行展开为 16 个图像词元，加上图像起止标记，即可进入序列。</text><text x="30" y="466" font-size="17" fill="#536c80" font-weight="400">这是可逆的四颜色数组编码；真实模型可使用训练得到的视觉量化器。</text></g></svg>