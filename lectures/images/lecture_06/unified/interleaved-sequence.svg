t-size="22" fill="#17334a" font-weight="400">→ 文字　&lt;图像&gt;　文字</text><text x="30" y="470" font-size="22" fill="#17334a" font-weight="400">同一个任务接口中，图像既可以是条件，也可以是需要预测的输出。</text><text x="30" y="511" font-size="17" fill="#536c80" font-weight="400">任务标记、模态边界与位置编码帮助模型区分“已知上下文”与“待生成内容”。</text></g></svg>