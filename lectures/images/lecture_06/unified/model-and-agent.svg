<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img"><title>统一模型提供能力，智能体把能力组织成行动</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="465" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">统一模型提供能力，智能体把能力组织成行动</text><rect x="30" y="110" width="440" height="145" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="140" font-size="21" fill="#17334a" font-weight="400">统一模型：能力层</text><text x="44" y="169" font-size="21" fill="#17334a" font-weight="400">图文理解、文字生成、图像生成</text><text x="44" y="198" font-size="21" fill="#17334a" font-weight="400">共享上下文与部分／全部参数</text><text x="44" y="227" font-size="21" fill="#17334a" font-weight="400">不要求所有模态使用同一编码器</text><rect x="530" y="110" width="440" height="145" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="544" y="140" font-size="21" fill="#17334a" font-weight="400">智能体：系统运行层</text><text x="544" y="169" font-size="21" fill="#17334a" font-weight="400">目标、状态、动作、观察、反馈</text><text x="544" y="198" font-size="21" fill="#17334a" font-weight="400">可调用统一模型，也可调度多个模型</text><text x="544" y="227" font-size="21" fill="#17334a" font-weight="400">必须依据结果决定继续、纠正或停止</text><text x="30" y="345" font-size="21" fill="#17334a" font-weight="400">一轮统一模型输出，可以没有工具和反馈；多个专用模型也能组成智能体。</text><text x="30" y="395" font-size="23" fill="#17334a" font-weight="400">模型是否统一，与系统是否闭环，是两个需要分别检查的问题。</text><text x="30" y="441" font-size="17" fill="#536c80" font-weight="400">图像编辑可作为模型的一轮输出，也可作为智能体执行任务的一次动作。</text></g></svg>