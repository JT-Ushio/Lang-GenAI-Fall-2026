<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img"><title>评价闭环：会说、会画、做成任务分别检查</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="555" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">评价闭环：会说、会画、做成任务分别检查</text><text x="30" y="138" font-size="23" fill="#17334a" font-weight="600">理解正确</text><rect x="300" y="110" width="660" height="100" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="314" y="140" font-size="21" fill="#17334a" font-weight="400">对象、属性、关系是否真实</text><text x="314" y="169" font-size="21" fill="#17334a" font-weight="400">不能只读自己的文字计划</text><text x="30" y="268" font-size="23" fill="#17334a" font-weight="600">生成／编辑正确</text><rect x="300" y="240" width="660" height="100" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="314" y="270" font-size="21" fill="#17334a" font-weight="400">目标是否实现，保留项是否成立</text><text x="314" y="299" font-size="21" fill="#17334a" font-weight="400">语义正确与图像质量分开</text><text x="30" y="398" font-size="23" fill="#17334a" font-weight="600">任务真正完成</text><rect x="300" y="370" width="660" height="100" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="314" y="400" font-size="21" fill="#17334a" font-weight="400">实际动作结果通过验收</text><text x="314" y="429" font-size="21" fill="#17334a" font-weight="400">控制工具错误、预算与停止</text><text x="30" y="531" font-size="17" fill="#536c80" font-weight="400">微型实验用可精确读取的像素验收；真实任务还需可靠工具、外部证据或人工评价。</text></g></svg>