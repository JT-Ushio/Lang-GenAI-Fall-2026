<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>统一建模之前：图像有不止一种表示</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">统一建模之前：图像有不止一种表示</text><text x="30" y="105" font-size="23" fill="#17334a" font-weight="600">语义视觉特征</text><rect x="30" y="125" width="300" height="155" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="155" font-size="21" fill="#17334a" font-weight="400">ViT 编码图像</text><text x="44" y="184" font-size="21" fill="#17334a" font-weight="400">利于识别对象与关系</text><text x="44" y="213" font-size="21" fill="#17334a" font-weight="400">常为连续向量</text><text x="358" y="105" font-size="23" fill="#17334a" font-weight="600">离散图像词元</text><rect x="358" y="125" width="300" height="155" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="372" y="155" font-size="21" fill="#17334a" font-weight="400">量化器给出视觉编号</text><text x="372" y="184" font-size="21" fill="#17334a" font-weight="400">预测编号，再解码为图像</text><text x="372" y="213" font-size="21" fill="#17334a" font-weight="400">可用交叉熵训练</text><text x="686" y="105" font-size="23" fill="#17334a" font-weight="600">连续图像潜变量</text><rect x="686" y="125" width="300" height="155" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="700" y="155" font-size="21" fill="#17334a" font-weight="400">VAE 压缩像素</text><text x="700" y="184" font-size="21" fill="#17334a" font-weight="400">预测流／去噪更新</text><text x="700" y="213" font-size="21" fill="#17334a" font-weight="400">可用回归目标训练</text><text x="30" y="355" font-size="22" fill="#17334a" font-weight="400">理解关心“是什么、什么关系”，生成还要还原纹理、颜色和空间细节。</text><text x="30" y="405" font-size="22" fill="#17334a" font-weight="400">统一核心模型，不要求强迫所有视觉任务共用同一种输入表示。</text><text x="30" y="446" font-size="17" fill="#536c80" font-weight="400">Janus 解耦两种视觉编码；BAGEL 同时利用语义视觉特征与 VAE 潜变量。</text></g></svg>