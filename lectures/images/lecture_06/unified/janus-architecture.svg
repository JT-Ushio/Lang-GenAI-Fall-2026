<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img"><title>Janus-Pro-7B：视觉编码解耦，Transformer 统一</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="635" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">Janus-Pro-7B：视觉编码解耦，Transformer 统一</text><rect x="30" y="100" width="440" height="115" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="130" font-size="21" fill="#17334a" font-weight="400">理解图像 [B,3,384,384]</text><text x="44" y="159" font-size="21" fill="#17334a" font-weight="400">SigLIP：24×24=576 个块</text><text x="44" y="188" font-size="21" fill="#17334a" font-weight="400">语义特征 [B,576,1024]</text><rect x="530" y="100" width="440" height="115" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="544" y="130" font-size="21" fill="#17334a" font-weight="400">生成路径：VQ-16 图像编码</text><text x="544" y="159" font-size="21" fill="#17334a" font-weight="400">576 个视觉编号，码本大小 16384</text><text x="544" y="188" font-size="21" fill="#17334a" font-weight="400">每个编号查表为 8 维向量</text><path d="M250 227L340 280" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M750 227L660 280" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="220" y="295" width="560" height="110" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="234" y="325" font-size="21" fill="#17334a" font-weight="400">两路分别投影到 4096 维</text><text x="234" y="354" font-size="21" fill="#17334a" font-weight="400">共享 Transformer，上下文 [B,L,4096]</text><text x="234" y="383" font-size="21" fill="#17334a" font-weight="400">视觉编码解耦，核心序列处理统一</text><path d="M340 417L250 465" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M660 417L750 465" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="480" width="440" height="90" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="510" font-size="21" fill="#17334a" font-weight="400">文字输出头：102400 类</text><text x="44" y="539" font-size="21" fill="#17334a" font-weight="400">例如看图回答</text><rect x="530" y="480" width="440" height="90" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="544" y="510" font-size="21" fill="#17334a" font-weight="400">图像输出头：16384 类</text><text x="544" y="539" font-size="21" fill="#17334a" font-weight="400">自回归生成 576 编号，再解码</text><text x="30" y="611" font-size="17" fill="#536c80" font-weight="400">具体维度来自公开配置与作者推理代码；不能据此假定 Janus-Pro 自带任意指令编辑能力。</text></g></svg>