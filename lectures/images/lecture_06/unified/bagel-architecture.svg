<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="605" viewBox="0 0 1000 605" role="img"><title>BAGEL：语义特征与连续潜变量共同进入上下文</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="605" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">BAGEL：语义特征与连续潜变量共同进入上下文</text><rect x="30" y="105" width="440" height="115" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="135" font-size="21" fill="#17334a" font-weight="400">语义路径：图像 → ViT 特征</text><text x="44" y="164" font-size="21" fill="#17334a" font-weight="400">提供对象、关系、上下文信息</text><text x="44" y="193" font-size="21" fill="#17334a" font-weight="400">经连接器进入多模态序列</text><rect x="530" y="105" width="440" height="115" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="544" y="135" font-size="21" fill="#17334a" font-weight="400">像素路径：图像 ↔ VAE 潜变量</text><text x="544" y="164" font-size="21" fill="#17334a" font-weight="400">例如 512×512 → 16×64×64</text><text x="544" y="193" font-size="21" fill="#17334a" font-weight="400">2×2 潜块 → 1024 个位置</text><path d="M250 232L340 285" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M750 232L660 285" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="180" y="300" width="640" height="115" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="194" y="330" font-size="21" fill="#17334a" font-weight="400">MoT：Mixture of Transformer Experts</text><text x="194" y="359" font-size="21" fill="#17334a" font-weight="400">共享上下文与注意力交互，部分参数按模态分工</text><text x="194" y="388" font-size="21" fill="#17334a" font-weight="400">文字自回归；图像以 Rectified Flow 更新</text><text x="30" y="495" font-size="22" fill="#17334a" font-weight="400">先理解图文要求，再生成／编辑图像；新图可进入后续对话上下文。</text><text x="30" y="540" font-size="21" fill="#17334a" font-weight="400">512×512 是维度示例，不表示模型所有输入都固定为该分辨率。</text><text x="30" y="581" font-size="17" fill="#536c80" font-weight="400">VAE 下采样 8 倍、16 通道；再做 2×2 潜块嵌入。完整注意力还隔离干净与加噪视觉块。</text></g></svg>