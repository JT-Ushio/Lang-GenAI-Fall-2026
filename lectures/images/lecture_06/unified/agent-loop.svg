<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img"><title>多模态智能体：把生成结果重新变成观察</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="580" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">多模态智能体：把生成结果重新变成观察</text><rect x="30" y="110" width="260" height="110" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="140" font-size="19" fill="#17334a" font-weight="400">观察</text><text x="44" y="169" font-size="19" fill="#17334a" font-weight="400">读取当前图像</text><text x="44" y="198" font-size="19" fill="#17334a" font-weight="400">提取事实与对象</text><rect x="370" y="110" width="260" height="110" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="384" y="140" font-size="19" fill="#17334a" font-weight="400">规划／选择动作</text><text x="384" y="169" font-size="19" fill="#17334a" font-weight="400">结合目标与记忆</text><text x="384" y="198" font-size="19" fill="#17334a" font-weight="400">生成可执行参数</text><rect x="710" y="110" width="260" height="110" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="724" y="140" font-size="19" fill="#17334a" font-weight="400">执行</text><text x="724" y="169" font-size="19" fill="#17334a" font-weight="400">编辑、生成或调用工具</text><text x="724" y="198" font-size="19" fill="#17334a" font-weight="400">产生新图或外部结果</text><rect x="370" y="335" width="260" height="110" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="384" y="365" font-size="19" fill="#17334a" font-weight="400">再次观察与验收</text><text x="384" y="394" font-size="19" fill="#17334a" font-weight="400">检查目标与保留条件</text><text x="384" y="423" font-size="19" fill="#17334a" font-weight="400">决定纠错、继续或停止</text><path d="M302 165L355 165" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M642 165L695 165" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M840 233L840 390L645 390" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M355 390L160 390L160 233" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><text x="30" y="515" font-size="21" fill="#17334a" font-weight="400">状态包含目标、原图、当前图、动作记录与剩余预算；计划不是完成证据。</text><text x="30" y="556" font-size="17" fill="#536c80" font-weight="400">统一模型可承担观察与生成；规划、工具、环境、验收和停止条件构成运行系统。</text></g></svg>