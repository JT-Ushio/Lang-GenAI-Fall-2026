<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img"><title>语言连接观察、目标与修改：从条件词到任务约束</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="465" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">语言连接观察、目标与修改：从条件词到任务约束</text><rect x="30" y="110" width="440" height="145" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="140" font-size="21" fill="#17334a" font-weight="400">原图：左红、右蓝</text><text x="44" y="169" font-size="21" fill="#17334a" font-weight="400">指令一：把左边改为绿色</text><text x="44" y="198" font-size="21" fill="#17334a" font-weight="400">指令二：把它也换成参考图的风格</text><text x="44" y="227" font-size="21" fill="#17334a" font-weight="400">必须保留原图与前文中的对象对应</text><rect x="530" y="110" width="440" height="145" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="544" y="140" font-size="21" fill="#17334a" font-weight="400">指称：它具体指哪个对象？</text><text x="544" y="169" font-size="21" fill="#17334a" font-weight="400">语义：需要改变哪一个属性？</text><text x="544" y="198" font-size="21" fill="#17334a" font-weight="400">预设：这个对象是否存在？</text><text x="544" y="227" font-size="21" fill="#17334a" font-weight="400">语用：哪几项必须保持不变？</text><text x="30" y="345" font-size="22" fill="#17334a" font-weight="400">长上下文有助于携带图像与指令；是否正确绑定对象仍须检查输出。</text><text x="30" y="395" font-size="21" fill="#17334a" font-weight="400">“换一种风格”与“换掉主体”改变的属性不同，不能只评价画面是否漂亮。</text><text x="30" y="441" font-size="17" fill="#536c80" font-weight="400">上下文统一是一种建模条件；指称一致、跨语言等值与视觉结果正确仍是独立评价对象。</text></g></svg>