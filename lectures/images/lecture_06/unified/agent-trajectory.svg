<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="525" viewBox="0 0 1000 525" role="img"><title>执行、看结果、纠错：反馈改变下一步动作</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="525" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">执行、看结果、纠错：反馈改变下一步动作</text><text x="30" y="100" font-size="22" fill="#17334a" font-weight="600">原图</text><image x="30" y="125" width="200" height="200" href="data:image/png;base64,"/><text x="275" y="100" font-size="22" fill="#17334a" font-weight="600">动作 1</text><image x="275" y="125" width="200" height="200" href="data:image/png;base64,"/><text x="275" y="365" font-size="20" fill="#17334a" font-weight="400">实际改右为绿</text><text x="275" y="405" font-size="20" fill="#17334a" font-weight="400">验收：未通过</text><text x="520" y="100" font-size="22" fill="#17334a" font-weight="600">动作 2</text><image x="520" y="125" width="200" height="200" href="data:image/png;base64,"/><text x="520" y="365" font-size="20" fill="#17334a" font-weight="400">实际改右为蓝</text><text x="520" y="405" font-size="20" fill="#17334a" font-weight="400">验收：未通过</text><text x="765" y="100" font-size="22" fill="#17334a" font-weight="600">动作 3</text><image x="765" y="125" width="200" height="200" href="data:image/png;base64,"/><text x="765" y="365" font-size="20" fill="#17334a" font-weight="400">实际改左为绿</text><text x="765" y="405" font-size="20" fill="#17334a" font-weight="400">验收：通过</text><text x="30" y="460" font-size="21" fill="#17334a" font-weight="400">目标：左变绿、右保持蓝。首次执行错位 → 恢复右侧 → 完成左侧修改。</text><text x="30" y="501" font-size="17" fill="#536c80" font-weight="400">规划与验收为规则；看图回答和编辑都调用同一个训练后模型。首次错位由实验注入。</text></g></svg>