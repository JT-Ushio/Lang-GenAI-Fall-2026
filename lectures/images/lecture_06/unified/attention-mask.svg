l="#307f82"/><rect x="702" y="243" width="38" height="38" rx="3" fill="#307f82"/><rect x="743" y="243" width="38" height="38" rx="3" fill="#e5ebf2"/><rect x="784" y="243" width="38" height="38" rx="3" fill="#e5ebf2"/><rect x="579" y="284" width="38" height="38" rx="3" fill="#307f82"/><rect x="620" y="284" width="38" height="38" rx="3" fill="#307f82"/><rect x="661" y="284" width="38" height="38" rx="3" fill="#307f82"/><rect x="702" y="284" width="38" height="38" rx="3" fill="#307f82"/><rect x="743" y="284" width="38" height="38" rx="3" fill="#e5ebf2"/><rect x="784" y="284" width="38" height="38" rx="3" fill="#e5ebf2"/><rect x="579" y="325" width="38" height="38" rx="3" fill="#307f82"/><rect x="620" y="325" width="38" height="38" rx="3" fill="#307f82"/><rect x="661" y="325" width="38" height="38" rx="3" fill="#307f82"/><rect x="702" y="325" width="38" height="38" rx="3" fill="#307f82"/><rect x="743" y="325" width="38" height="38" rx="3" fill="#307f82"/><rect x="784" y="325" width="38" height="38" rx="3" fill="#e5ebf2"/><rect x="579" y="366" width="38" height="38" rx="3" fill="#307f82"/><rect x="620" y="366" width="38" height="38" rx="3" fill="#307f82"/><rect x="661" y="366" width="38" height="38" rx="3" fill="#307f82"/><rect x="702" y="366" width="38" height="38" rx="3" fill="#307f82"/><rect x="743" y="366" width="38" height="38" rx="3" fill="#307f82"/><rect x="784" y="366" width="38" height="38" rx="3" fill="#307f82"/><text x="40" y="478" font-size="21" fill="#17334a" font-weight="400">行是查询，列是可读取的位置；绿色表示允许，灰色表示屏蔽。</text><text x="40" y="522" font-size="21" fill="#17334a" font-weight="400">I1、I2 可互相读取；后面的 T3、T4 仍不能泄漏给前面的位置。</text><text x="30" y="561" font-size="17" fill="#536c80" font-weight="400">右图仅展示已知条件块的简化规则，不包含 BAGEL 的干净／加噪视觉块隔离。</text></g></svg>