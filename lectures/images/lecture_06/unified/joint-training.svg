<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img"><title>能力从哪里来：多任务数据、监督位置与共享梯度</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="485" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">能力从哪里来：多任务数据、监督位置与共享梯度</text><text x="30" y="100" font-size="23" fill="#17334a" font-weight="600">理解样本</text><rect x="30" y="125" width="300" height="115" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="155" font-size="20" fill="#17334a" font-weight="400">图像＋问题 → 答案</text><text x="44" y="184" font-size="20" fill="#17334a" font-weight="400">监督答案区的文字词元</text><text x="358" y="100" font-size="23" fill="#17334a" font-weight="600">生成样本</text><rect x="358" y="125" width="300" height="115" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="372" y="155" font-size="20" fill="#17334a" font-weight="400">描述 → 目标图像</text><text x="372" y="184" font-size="20" fill="#17334a" font-weight="400">监督视觉编号或流预测</text><text x="686" y="100" font-size="23" fill="#17334a" font-weight="600">交错与编辑样本</text><rect x="686" y="125" width="300" height="115" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="700" y="155" font-size="20" fill="#17334a" font-weight="400">原图＋修改要求 → 新图</text><text x="700" y="184" font-size="20" fill="#17334a" font-weight="400">学习前后关系与内容连续性</text><text x="30" y="315" font-size="27" fill="#307f82" font-weight="400">L_total = λ_u L_understand + λ_g L_generate</text><text x="30" y="370" font-size="22" fill="#17334a" font-weight="400">监督位置由任务决定；输入上下文、补齐位置和待预测输出要分开。</text><text x="30" y="420" font-size="21" fill="#17334a" font-weight="400">两项损失都能更新共享参数，但任务可能竞争，需要检查数据配比与各项能力。</text><text x="30" y="461" font-size="17" fill="#536c80" font-weight="400">离散词元可用交叉熵；连续流通常使用回归损失。把损失相加并不自动保证能力相互促进。</text></g></svg>