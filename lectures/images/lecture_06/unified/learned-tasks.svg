<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img"><title>实际输出：三个任务共享一套模型参数</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="465" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">实际输出：三个任务共享一套模型参数</text><text x="30" y="100" font-size="23" fill="#17334a" font-weight="600">图像 → 文字</text><image x="30" y="125" width="220" height="220" href="data:image/png;base64,"/><text x="30" y="390" font-size="21" fill="#17334a" font-weight="400">模型回答：左：红；右：蓝</text><text x="355" y="100" font-size="23" fill="#17334a" font-weight="600">文字 → 图像</text><image x="355" y="125" width="220" height="220" href="data:image/png;base64,"/><text x="355" y="390" font-size="21" fill="#17334a" font-weight="400">条件：左绿、右蓝</text><text x="680" y="100" font-size="23" fill="#17334a" font-weight="600">图像＋指令 → 图像</text><image x="680" y="125" width="220" height="220" href="data:image/png;base64,"/><text x="680" y="390" font-size="20" fill="#17334a" font-weight="400">原图左红右蓝；改左为绿</text><text x="30" y="441" font-size="17" fill="#536c80" font-weight="400">共享 42,834 参数；固定词表和四颜色图像。选项映射为词元，不代表开放自然语言理解。</text></g></svg>