<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img"><title>Show-o：一个核心模型，两种预测顺序</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="500" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">Show-o：一个核心模型，两种预测顺序</text><rect x="30" y="110" width="440" height="140" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="140" font-size="22" fill="#17334a" font-weight="400">文字区：自回归预测</text><text x="44" y="169" font-size="22" fill="#17334a" font-weight="400">只读取已知前缀</text><text x="44" y="198" font-size="22" fill="#17334a" font-weight="400">下一词元交叉熵</text><rect x="530" y="110" width="440" height="140" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="544" y="140" font-size="21" fill="#17334a" font-weight="400">图像区：掩码词元预测</text><text x="544" y="169" font-size="21" fill="#17334a" font-weight="400">读取上下文与当前可见视觉词元</text><text x="544" y="198" font-size="21" fill="#17334a" font-weight="400">逐轮恢复缺失图像信息</text><text x="30" y="330" font-size="21" fill="#17334a" font-weight="400">Show-o 经典离散配置：256×256 图像 → 16×16=256 个编号。</text><text x="30" y="380" font-size="21" fill="#17334a" font-weight="400">视觉码本 8192；统一词表、任务标记与注意力规则共同组织序列。</text><text x="30" y="430" font-size="21" fill="#17334a" font-weight="400">训练目标：文字预测＋被遮盖视觉词元预测；图像区可使用块内双向注意力。</text><text x="30" y="476" font-size="17" fill="#536c80" font-weight="400">掩码迭代在离散视觉空间进行，与第五讲连续像素／潜变量加噪不是同一表示。</text></g></svg>