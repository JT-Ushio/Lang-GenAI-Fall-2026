<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="525" viewBox="0 0 1000 525" role="img"><title>同一个微型 Transformer：看图、生成、编辑</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="525" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">同一个微型 Transformer：看图、生成、编辑</text><path d="M75 110V365H630" fill="none" stroke="#9ab9c1" stroke-width="2"/><polyline points="75.0,130.0 129.5,364.2 184.0,364.8 238.5,364.9 293.0,364.9 347.5,364.9 402.0,365.0 456.5,365.0 511.0,365.0 565.5,365.0 620.0,365.0" fill="none" stroke="#307f82" stroke-width="3"/><polyline points="75.0,144.2 129.5,364.1 184.0,364.9 238.5,364.9 293.0,365.0 347.5,365.0 402.0,365.0 456.5,365.0 511.0,365.0 565.5,365.0 620.0,365.0" fill="none" stroke="#d58c35" stroke-width="3"/><polyline points="75.0,158.3 129.5,356.5 184.0,363.8 238.5,364.9 293.0,364.9 347.5,365.0 402.0,365.0 456.5,365.0 511.0,365.0 565.5,365.0 620.0,365.0" fill="none" stroke="#8065aa" stroke-width="3"/><text x="75" y="400" font-size="19" fill="#17334a" font-weight="400">0</text><text x="510" y="400" font-size="19" fill="#17334a" font-weight="400">1000 次更新</text><text x="680" y="155" font-size="20" fill="#307f82" font-weight="600">理解：自由生成精确匹配</text><text x="680" y="190" font-size="25" fill="#307f82" font-weight="400">9 / 9</text><text x="680" y="245" font-size="20" fill="#d58c35" font-weight="600">生成：自由生成精确匹配</text><text x="680" y="280" font-size="25" fill="#d58c35" font-weight="400">9 / 9</text><text x="680" y="335" font-size="20" fill="#8065aa" font-weight="600">编辑：自由生成精确匹配</text><text x="680" y="370" font-size="25" fill="#8065aa" font-weight="400">54 / 54</text><text x="40" y="460" font-size="21" fill="#17334a" font-weight="400">同一套参数；三种任务均参与训练。评估逐步生成，不喂标准答案前缀。</text><text x="30" y="501" font-size="17" fill="#536c80" font-weight="400">曲线为各任务交叉熵；72 个样本全部用于训练，因此这里检验拟合，不是泛化能力。</text></g></svg>