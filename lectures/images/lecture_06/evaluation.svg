<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>编辑有多重目标：执行、保留和质量分别评价</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">编辑有多重目标：执行、保留和质量分别评价</text><text x="30" y="108" font-size="23" fill="#17334a" font-weight="600">修改是否成功</text><rect x="30" y="130" width="300" height="110" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="44" y="160" font-size="20" fill="#17334a" font-weight="400">目标颜色／对象／关系改变</text><text x="44" y="189" font-size="20" fill="#17334a" font-weight="400">还要检查是否改对了对象</text><text x="358" y="108" font-size="23" fill="#17334a" font-weight="600">其他内容是否保留</text><rect x="358" y="130" width="300" height="110" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="372" y="160" font-size="20" fill="#17334a" font-weight="400">编辑区域外像素／语义</text><text x="372" y="189" font-size="20" fill="#17334a" font-weight="400">身份、结构、背景是否漂移</text><text x="686" y="108" font-size="23" fill="#17334a" font-weight="600">画面是否自然</text><rect x="686" y="130" width="300" height="110" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="700" y="160" font-size="20" fill="#17334a" font-weight="400">接缝、纹理、光照与阴影</text><text x="700" y="189" font-size="20" fill="#17334a" font-weight="400">单一相似度分数无法覆盖</text><text x="30" y="315" font-size="21" fill="#17334a" font-weight="400">像素 MAE：在正确区域内求绝对差平均，要同时除以像素数和通道数。</text><text x="30" y="360" font-size="21" fill="#17334a" font-weight="400">不编辑：保留误差可能为 0，但任务失败。整图重画：任务可能成功，但保留失败。</text><text x="30" y="405" font-size="22" fill="#17334a" font-weight="400">先规定可观察的验收条件，再挑选自动指标和人工标注。</text><text x="30" y="446" font-size="17" fill="#536c80" font-weight="400">像素指标适用于对齐场景；镜头、光照或几何改变时，需要相应的语义评价和人工检查。</text></g></svg>