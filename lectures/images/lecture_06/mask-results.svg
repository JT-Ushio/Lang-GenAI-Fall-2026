<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img"><title>实际数组合成：遮罩范围决定哪些像素被替换</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="730" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">实际数组合成：遮罩范围决定哪些像素被替换</text><text x="30" y="105" font-size="19" fill="#17334a" font-weight="400">输入：红方块＋蓝圆形</text><image x="30" y="125" width="220" height="220" href="data:image/png;base64,"/><text x="360" y="105" font-size="19" fill="#17334a" font-weight="400">硬遮罩：白色允许编辑</text><image x="360" y="125" width="220" height="220" href="data:image/png;base64,"/><text x="690" y="105" font-size="19" fill="#17334a" font-weight="400">硬合成：只替换方块</text><image x="690" y="125" width="220" height="220" href="data:image/png;base64,"/><text x="30" y="405" font-size="19" fill="#17334a" font-weight="400">候选图：故意改变其他区域</text><image x="30" y="425" width="220" height="220" href="data:image/png;base64,"/><text x="360" y="405" font-size="19" fill="#17334a" font-weight="400">柔化遮罩：边界有中间值</text><image x="360" y="425" width="220" height="220" href="data:image/png;base64,"/><text x="690" y="405" font-size="19" fill="#17334a" font-weight="400">柔化合成：边缘也发生变化</text><image x="690" y="425" width="220" height="220" href="data:image/png;base64,"/><text x="30" y="706" font-size="17" fill="#536c80" font-weight="400">数组合成：I_out = M · I_edit + (1 − M) · I_source。</text></g></svg>