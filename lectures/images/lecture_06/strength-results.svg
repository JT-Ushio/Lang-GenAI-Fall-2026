<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img"><title>实际图生图小实验：从不同噪声水平开始</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="610" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">实际图生图小实验：从不同噪声水平开始</text><text x="30" y="93" font-size="21" fill="#17334a" font-weight="400">固定竖条源图、种子 42 和横条条件；MLP 实际预测，DDPM 实际更新。</text><text x="30" y="132" font-size="21" fill="#17334a" font-weight="600">先看加噪起点</text><image x="30" y="150" width="132" height="132" href="data:image/png;base64,"/><text x="30" y="310" font-size="20" fill="#17334a" font-weight="400">强度 0</text><image x="193" y="150" width="132" height="132" href="data:image/png;base64,"/><text x="193" y="310" font-size="20" fill="#17334a" font-weight="400">强度 0.1</text><image x="356" y="150" width="132" height="132" href="data:image/png;base64,"/><text x="356" y="310" font-size="20" fill="#17334a" font-weight="400">强度 0.3</text><image x="519" y="150" width="132" height="132" href="data:image/png;base64,"/><text x="519" y="310" font-size="20" fill="#17334a" font-weight="400">强度 0.6</text><image x="682" y="150" width="132" height="132" href="data:image/png;base64,"/><text x="682" y="310" font-size="20" fill="#17334a" font-weight="400">强度 0.9</text><image x="845" y="150" width="132" height="132" href="data:image/png;base64,"/><text x="845" y="310" font-size="20" fill="#17334a" font-weight="400">强度 1</text><text x="30" y="367" font-size="21" fill="#17334a" font-weight="600">再看条件去噪结果</text><image x="30" y="386" width="132" height="132" href="data:image/png;base64,"/><text x="30" y="548" font-size="19" fill="#17334a" font-weight="400">更新 0 次</text><image x="193" y="386" width="132" height="132" href="data:image/png;base64,"/><text x="193" y="548" font-size="19" fill="#17334a" font-weight="400">更新 10 次</text><image x="356" y="386" width="132" height="132" href="data:image/png;base64,"/><text x="356" y="548" font-size="19" fill="#17334a" font-weight="400">更新 30 次</text><image x="519" y="386" width="132" height="132" href="data:image/png;base64,"/><text x="519" y="548" font-size="19" fill="#17334a" font-weight="400">更新 60 次</text><image x="682" y="386" width="132" height="132" href="data:image/png;base64,"/><text x="682" y="548" font-size="19" fill="#17334a" font-weight="400">更新 90 次</text><image x="845" y="386" width="132" height="132" href="data:image/png;base64,"/><text x="845" y="548" font-size="19" fill="#17334a" font-weight="400">更新 100 次</text><text x="30" y="586" font-size="17" fill="#536c80" font-weight="400">训练数据：六张 8×8 模板；条件：横／竖类别；强度 0 直接返回原图。</text></g></svg>