<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img"><title>逐步保留已知区域：参考状态也要对齐噪声水平</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="590" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">逐步保留已知区域：参考状态也要对齐噪声水平</text><rect x="30" y="115" width="440" height="110" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="44" y="145" font-size="21" fill="#17334a" font-weight="400">网络＋采样器</text><text x="44" y="174" font-size="21" fill="#17334a" font-weight="400">把当前状态从 t 更新到 t−1</text><text x="44" y="203" font-size="21" fill="#17334a" font-weight="400">得到允许编辑区域的候选</text><rect x="530" y="115" width="440" height="110" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="544" y="145" font-size="21" fill="#17334a" font-weight="400">原图＋已知噪声规则</text><text x="544" y="174" font-size="21" fill="#17334a" font-weight="400">构造同一噪声水平 t−1 的参考</text><text x="544" y="203" font-size="21" fill="#17334a" font-weight="400">提供保留区域的对应状态</text><path d="M250 237L360 294" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M750 237L640 294" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="220" y="310" width="560" height="100" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="234" y="340" font-size="21" fill="#17334a" font-weight="400">按遮罩组合：编辑区域取候选，其他取参考</text><text x="234" y="369" font-size="21" fill="#17334a" font-weight="400">循环到终点，参考回到干净原图</text><text x="30" y="480" font-size="22" fill="#17334a" font-weight="400">中间状态有噪声时，直接贴干净原图会混合两个噪声水平。</text><text x="30" y="525" font-size="21" fill="#17334a" font-weight="400">在潜空间保留并不自动保证最终像素逐点相同；严格保留需检查解码与最终合成。</text><text x="30" y="566" font-size="17" fill="#536c80" font-weight="400">本例在每次去噪后投影已知区域；RePaint 还使用重采样日程。</text></g></svg>