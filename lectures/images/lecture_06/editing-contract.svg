<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img"><title>图像编辑：修改目标与保留条件</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="450" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">图像编辑：修改目标与保留条件</text><rect x="30" y="115" width="440" height="145" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="145" font-size="21" fill="#17334a" font-weight="400">输入图：左红方块，右蓝圆形</text><text x="44" y="174" font-size="21" fill="#17334a" font-weight="400">指令：只把左边方块改成绿色</text><text x="44" y="203" font-size="21" fill="#17334a" font-weight="400">保留：圆形、位置、背景</text><path d="M480 188L515 188" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="530" y="115" width="440" height="145" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="544" y="145" font-size="21" fill="#17334a" font-weight="400">输出：满足修改要求</text><text x="544" y="174" font-size="21" fill="#17334a" font-weight="400">同时保留不应改变的信息</text><text x="544" y="203" font-size="21" fill="#17334a" font-weight="400">编辑目标＋保留约束共同成立</text><text x="30" y="330" font-size="23" fill="#17334a" font-weight="400">描述“最终想要什么”，还要说清“从什么出发、允许改哪里”。</text><text x="30" y="383" font-size="22" fill="#17334a" font-weight="400">同一条指令需要核查：对象、改动、作用范围与保留项。</text><text x="30" y="426" font-size="17" fill="#536c80" font-weight="400">编辑结果需要与原图及修改要求共同核对。</text></g></svg>