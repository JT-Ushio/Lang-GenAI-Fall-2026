<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"><title>语言学连接：用最小对照划清编辑指令的作用范围</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="480" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">语言学连接：用最小对照划清编辑指令的作用范围</text><rect x="30" y="110" width="440" height="130" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="140" font-size="21" fill="#17334a" font-weight="400">固定：原图、模型、采样器、种子</text><text x="44" y="169" font-size="21" fill="#17334a" font-weight="400">每次只改一个词或一个输入因素</text><text x="44" y="198" font-size="21" fill="#17334a" font-weight="400">使用多组相同种子成对比较</text><rect x="530" y="110" width="440" height="130" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="544" y="140" font-size="20" fill="#17334a" font-weight="400">A：把左边的红方块改成绿色</text><text x="544" y="169" font-size="20" fill="#17334a" font-weight="400">B：把右边的蓝圆形改成绿色</text><text x="544" y="198" font-size="20" fill="#17334a" font-weight="400">分别核查目标、范围和保留项</text><text x="30" y="319" font-size="22" fill="#17334a" font-weight="400">反例控制：原图不动、整图改色、局部改色，都必须进入比较。</text><text x="30" y="366" font-size="21" fill="#17334a" font-weight="400">跨语言对照先核对指令等值；不要把翻译改变任务造成的差异算作模型语言偏差。</text><text x="30" y="413" font-size="22" fill="#17334a" font-weight="400">报告成功率、保留误差与典型失败，保留失败样本和实际参数。</text><text x="30" y="456" font-size="17" fill="#536c80" font-weight="400">“只改……”是语义约束；是否执行要靠可观察的输出与对照实验检验。</text></g></svg>