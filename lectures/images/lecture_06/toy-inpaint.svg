<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img"><title>训练后的小模型：在允许区域生成，并保留已知区域</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="450" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">训练后的小模型：在允许区域生成，并保留已知区域</text><text x="30" y="100" font-size="19" fill="#17334a" font-weight="400">原图：竖条</text><image x="30" y="125" width="200" height="200" href="data:image/png;base64,"/><text x="275" y="100" font-size="19" fill="#17334a" font-weight="400">允许编辑的中间四行</text><image x="275" y="125" width="200" height="200" href="data:image/png;base64,"/><text x="520" y="100" font-size="19" fill="#17334a" font-weight="400">无区域约束</text><image x="520" y="125" width="200" height="200" href="data:image/png;base64,"/><text x="765" y="100" font-size="19" fill="#17334a" font-weight="400">逐步约束＋最终保留</text><image x="765" y="125" width="200" height="200" href="data:image/png;base64,"/><text x="30" y="384" font-size="21" fill="#17334a" font-weight="400">遮罩外像素最大误差 = 0；这是显式保留规则的保证，不代表模型懂了“只修改”。</text><text x="30" y="426" font-size="17" fill="#536c80" font-weight="400">8×8 条纹模型；横条条件；强度 0.9；种子 42；允许编辑中间四行。</text></g></svg>