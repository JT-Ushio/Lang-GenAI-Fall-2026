<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img"><title>ControlNet：把结构条件接进预训练生成网络</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="565" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">ControlNet：把结构条件接进预训练生成网络</text><rect x="30" y="105" width="440" height="115" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="135" font-size="21" fill="#17334a" font-weight="400">原有预训练去噪网络（冻结）</text><text x="44" y="164" font-size="21" fill="#17334a" font-weight="400">潜变量＋时间＋文字</text><text x="44" y="193" font-size="21" fill="#17334a" font-weight="400">输出生成所需的预测</text><rect x="530" y="105" width="440" height="115" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="544" y="135" font-size="21" fill="#17334a" font-weight="400">可训练的控制分支</text><text x="544" y="164" font-size="21" fill="#17334a" font-weight="400">复用编码层初始化</text><text x="544" y="193" font-size="21" fill="#17334a" font-weight="400">同时读取结构条件</text><rect x="530" y="275" width="440" height="105" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="544" y="305" font-size="20" fill="#17334a" font-weight="400">条件图 [B,3,512,512]</text><text x="544" y="334" font-size="20" fill="#17334a" font-weight="400">提示编码 → [B,320,64,64]</text><text x="544" y="363" font-size="20" fill="#17334a" font-weight="400">边缘图的三个通道可以相同</text><path d="M750 264L750 232" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="275" width="440" height="105" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="44" y="305" font-size="20" fill="#17334a" font-weight="400">零卷积输出控制残差</text><text x="44" y="334" font-size="20" fill="#17334a" font-weight="400">多个分辨率对应相加</text><text x="44" y="363" font-size="20" fill="#17334a" font-weight="400">进入主干中间块与上行层级</text><path d="M600 220L500 250L500 325L483 325" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><path d="M250 263L250 232" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><text x="30" y="454" font-size="21" fill="#17334a" font-weight="400">64²×320 → 32²×640 → 16²×1280 → 8²×1280：代表性空间层级。</text><text x="30" y="498" font-size="21" fill="#17334a" font-weight="400">零初始化让分支初始贡献为 0；训练后残差可逐渐改变，控制强度也可调节。</text><text x="30" y="541" font-size="17" fill="#536c80" font-weight="400">经典 SD 1.5 兼容案例；图示省略块内细节，多层残差形状必须与被加的特征一致。</text></g></svg>