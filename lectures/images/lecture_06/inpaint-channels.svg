<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="605" viewBox="0 0 1000 605" role="img"><title>经典专用局部重绘接口：为什么输入是 9 通道？</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="605" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">经典专用局部重绘接口：为什么输入是 9 通道？</text><rect x="30" y="110" width="300" height="90" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="140" font-size="21" fill="#17334a" font-weight="400">当前潜噪声</text><text x="44" y="169" font-size="21" fill="#17334a" font-weight="400">[B,4,64,64]</text><rect x="358" y="110" width="300" height="90" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="372" y="140" font-size="21" fill="#17334a" font-weight="400">编辑区域遮罩</text><text x="372" y="169" font-size="21" fill="#17334a" font-weight="400">[B,1,64,64]</text><rect x="686" y="110" width="300" height="90" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="700" y="140" font-size="21" fill="#17334a" font-weight="400">被遮挡图的编码</text><text x="700" y="169" font-size="21" fill="#17334a" font-weight="400">[B,4,64,64]</text><text x="30" y="264" font-size="26" fill="#307f82" font-weight="400">按通道拼接：4＋1＋4＝9</text><path d="M500 285L500 322" fill="none" stroke="#307f82" stroke-width="3" marker-end="url(#a)"/><rect x="270" y="335" width="460" height="100" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="284" y="365" font-size="21" fill="#17334a" font-weight="400">专用 inpainting U-Net 输入 [B,9,64,64]</text><text x="284" y="394" font-size="21" fill="#17334a" font-weight="400">输出仍为噪声预测 [B,4,64,64]</text><text x="30" y="495" font-size="21" fill="#17334a" font-weight="400">CFG 合并两条分支时：输入 [2B,9,64,64]，不是 [B,18,64,64]。</text><text x="30" y="540" font-size="21" fill="#17334a" font-weight="400">先在像素图上遮挡，再做 VAE 编码；一般不等于编码后把潜变量直接乘遮罩。</text><text x="30" y="581" font-size="17" fill="#536c80" font-weight="400">固定公开 SD 1.5 inpainting 配置；也存在用 4 通道基础模型配合采样规则的方案。</text></g></svg>