<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img"><title>指令编辑：让模型学习“怎么改”，而不只描述结果</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="510" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">指令编辑：让模型学习“怎么改”，而不只描述结果</text><rect x="30" y="105" width="440" height="110" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="135" font-size="21" fill="#17334a" font-weight="400">训练数据：原图＋编辑指令＋目标图</text><text x="44" y="164" font-size="21" fill="#17334a" font-weight="400">例如：把红方块改成绿色</text><text x="44" y="193" font-size="21" fill="#17334a" font-weight="400">模型学习“从原图做什么修改”</text><rect x="530" y="105" width="440" height="110" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="544" y="135" font-size="21" fill="#17334a" font-weight="400">经典 InstructPix2Pix 输入</text><text x="544" y="164" font-size="21" fill="#17334a" font-weight="400">噪声潜变量 4＋原图潜变量 4</text><text x="544" y="193" font-size="21" fill="#17334a" font-weight="400">合并为 [B,8,64,64]</text><text x="30" y="287" font-size="21" fill="#17334a" font-weight="400">三条预测：p_u（无条件）、p_I（仅图像）、p_IT（图像＋文字）。</text><text x="30" y="343" font-size="26" fill="#307f82" font-weight="400">p_hat = p_u + s_I (p_I − p_u) + s_T (p_IT − p_I)</text><text x="30" y="400" font-size="21" fill="#17334a" font-weight="400">批量合并三条分支：[3B,8,64,64]；与 9 通道局部重绘接口不同。</text><text x="30" y="447" font-size="21" fill="#17334a" font-weight="400">图像尺度与文字尺度分别调节保留原图、执行指令的倾向，不能视作硬约束。</text><text x="30" y="486" font-size="17" fill="#536c80" font-weight="400">图示固定经典 InstructPix2Pix；不同预测参数化需先对齐，不能跨接口直接混合数值。</text></g></svg>