<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img"><title>先明确遮罩含义，再讨论局部重绘</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="475" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">先明确遮罩含义，再讨论局部重绘</text><rect x="30" y="115" width="440" height="120" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="145" font-size="21" fill="#17334a" font-weight="400">遮罩 M=1：白色，允许编辑</text><text x="44" y="174" font-size="21" fill="#17334a" font-weight="400">遮罩 M=0：黑色，保留原图</text><text x="44" y="203" font-size="21" fill="#17334a" font-weight="400">本课所有代码沿用这一约定</text><rect x="530" y="115" width="440" height="120" rx="13" fill="#fff0da" stroke="#9ab9c1"/><text x="544" y="145" font-size="21" fill="#17334a" font-weight="400">硬遮罩：只有 0 与 1</text><text x="544" y="174" font-size="21" fill="#17334a" font-weight="400">柔化遮罩：边缘出现中间值</text><text x="544" y="203" font-size="21" fill="#17334a" font-weight="400">先核对工具的黑白语义，再运行</text><text x="30" y="315" font-size="27" fill="#307f82" font-weight="400">I_out = M · I_edit + (1 − M) · I_source</text><text x="30" y="365" font-size="21" fill="#17334a" font-weight="400">硬合成可精确保留 M=0 的像素；柔化会扩展过渡区，不能再宣称边界外全不变。</text><text x="30" y="410" font-size="21" fill="#17334a" font-weight="400">这是数组合成规则；生成候选图是否合理，还需要模型与评价。</text><text x="30" y="451" font-size="17" fill="#536c80" font-weight="400">透明度、图像编辑遮罩、文本注意力掩码的含义不同，不能仅凭名称互换。</text></g></svg>