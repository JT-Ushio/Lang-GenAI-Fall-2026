<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="435" viewBox="0 0 1000 435" role="img"><title>结构控制与参考图：提供的是不同的信息</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#307f82"/></marker></defs><rect width="1000" height="435" rx="18" fill="#f5f9fc"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="45" font-size="28" fill="#17334a" font-weight="600">结构控制与参考图：提供的是不同的信息</text><rect x="30" y="110" width="440" height="120" rx="13" fill="#eaf1fa" stroke="#9ab9c1"/><text x="44" y="140" font-size="21" fill="#17334a" font-weight="400">结构条件：轮廓／姿态／深度</text><text x="44" y="169" font-size="21" fill="#17334a" font-weight="400">强调空间布局和几何对应</text><text x="44" y="198" font-size="21" fill="#17334a" font-weight="400">同一轮廓仍可有多种颜色与材质</text><rect x="530" y="110" width="440" height="120" rx="13" fill="#e2f1f0" stroke="#9ab9c1"/><text x="544" y="140" font-size="21" fill="#17334a" font-weight="400">参考图条件：外观／身份／风格</text><text x="544" y="169" font-size="21" fill="#17334a" font-weight="400">由视觉编码器提取图像特征</text><text x="544" y="198" font-size="21" fill="#17334a" font-weight="400">不等于把参考图整张复制到画布</text><text x="30" y="320" font-size="22" fill="#17334a" font-weight="400">先判断需求缺的是几何布局、目标外观，还是语言中没有说清楚的内容。</text><text x="30" y="370" font-size="21" fill="#17334a" font-weight="400">多个条件可能冲突：姿态图要求站立，原图人物却在坐着；需要决定优先级。</text><text x="30" y="411" font-size="17" fill="#536c80" font-weight="400">方法之间可以组合，但接口、权重和模型训练必须兼容，不能把任意输入文件直接混用。</text></g></svg>