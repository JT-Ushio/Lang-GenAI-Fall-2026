<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="645" viewBox="0 0 1100 645"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#477b8b"/></marker></defs><rect width="1100" height="645" rx="18" fill="#f7fafc"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#17334a">CLIP 的使用：拿一张图片，与多个描述逐一比较</text><rect x="35" y="130" width="235" height="180" rx="12" fill="#ffffff" stroke="#609899"/><text x="51" y="160" font-size="19" fill="#17334a">待匹配图片</text><g transform="translate(105 205) scale(1.1)"><polygon points="10,23 8,0 28,14 52,14 72,0 70,23" fill="#edb56b" stroke="#477b8b" stroke-width="2"/><ellipse cx="40" cy="36" rx="33" ry="27" fill="#edb56b"/><circle cx="28" cy="31" r="3" fill="#17334a"/><circle cx="52" cy="31" r="3" fill="#17334a"/><path d="M36 41 L44 41 L40 46Z M9 41 L-1 38 M9 48 L-1 51 M71 41 L81 38 M71 48 L81 51" stroke="#17334a" fill="#17334a"/></g><path d="M285 220 L350 220" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="370" y="160" width="215" height="120" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="386" y="190" font-size="19" fill="#17334a">图像向量</text><text x="386" y="218" font-size="19" fill="#17334a">与每个文字向量</text><text x="386" y="246" font-size="19" fill="#17334a">分别计算相似度</text><rect x="650" y="115" width="400" height="95" rx="12" fill="#ffffff" stroke="#609899"/><text x="666" y="145" font-size="19" fill="#17334a">a photo of a cat</text><rect x="668" y="164" width="262.4" height="22" rx="5" fill="#78b7aa"/><text x="955" y="183" font-size="21" fill="#17334a">0.82</text><path d="M595 220 L638 160" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="650" y="240" width="400" height="95" rx="12" fill="#ffffff" stroke="#609899"/><text x="666" y="270" font-size="19" fill="#17334a">a photo of a fish</text><rect x="668" y="289" width="76.8" height="22" rx="5" fill="#cbd8e4"/><text x="955" y="308" font-size="21" fill="#17334a">0.24</text><path d="M595 220 L638 285" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="650" y="365" width="400" height="95" rx="12" fill="#ffffff" stroke="#609899"/><text x="666" y="395" font-size="19" fill="#17334a">a photo of a bus</text><rect x="668" y="414" width="35.2" height="22" rx="5" fill="#cbd8e4"/><text x="955" y="433" font-size="21" fill="#17334a">0.11</text><path d="M595 220 L638 410" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><text x="35" y="535" font-size="23" fill="#17334a">从已有描述中选最匹配的一项；改变候选描述，就改变了比较任务。</text><text x="35" y="580" font-size="22" fill="#17334a">“零样本分类”：用类别描述替代为这组类别另行训练的分类头。</text><text x="35" y="620" font-size="17" fill="#17334a">分数为手工示意，不是真实 CLIP 输出，也不是正确率；CLIP 本身不会在这里生成一句新描述。</text></g></svg>