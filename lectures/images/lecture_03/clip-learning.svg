<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="645" viewBox="0 0 1100 645"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#477b8b"/></marker></defs><rect width="1100" height="645" rx="18" fill="#f7fafc"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#17334a">CLIP 的训练：让配对表达逐渐对齐</text><text x="35" y="95" font-size="22" fill="#17334a">圆点代表图像，方块代表文字；同色代表已知配对。</text><rect x="40" y="135" width="445" height="300" rx="12" fill="#ffffff" stroke="#609899"/><text x="56" y="165" font-size="19" fill="#17334a">训练前：配对尚未对齐</text><rect x="605" y="135" width="445" height="300" rx="12" fill="#ffffff" stroke="#609899"/><text x="621" y="165" font-size="19" fill="#17334a">训练后：匹配方向更接近</text><path d="M100 245 L370 340" stroke="#bd7441" stroke-dasharray="6 5" stroke-width="2"/><circle cx="100" cy="245" r="12" fill="#bd7441"/><rect x="359" y="329" width="22" height="22" rx="2" fill="#bd7441"/><path d="M220 380 L150 310" stroke="#3a8e87" stroke-dasharray="6 5" stroke-width="2"/><circle cx="220" cy="380" r="12" fill="#3a8e87"/><rect x="139" y="299" width="22" height="22" rx="2" fill="#3a8e87"/><path d="M395 240 L290 210" stroke="#8271ad" stroke-dasharray="6 5" stroke-width="2"/><circle cx="395" cy="240" r="12" fill="#8271ad"/><rect x="279" y="199" width="22" height="22" rx="2" fill="#8271ad"/><path d="M685 240 L718 260" stroke="#bd7441" stroke-dasharray="6 5" stroke-width="2"/><circle cx="685" cy="240" r="12" fill="#bd7441"/><rect x="707" y="249" width="22" height="22" rx="2" fill="#bd7441"/><path d="M815 365 L846 345" stroke="#3a8e87" stroke-dasharray="6 5" stroke-width="2"/><circle cx="815" cy="365" r="12" fill="#3a8e87"/><rect x="835" y="334" width="22" height="22" rx="2" fill="#3a8e87"/><path d="M940 225 L978 250" stroke="#8271ad" stroke-dasharray="6 5" stroke-width="2"/><circle cx="940" cy="225" r="12" fill="#8271ad"/><rect x="967" y="239" width="22" height="22" rx="2" fill="#8271ad"/><path d="M500 285 L587 285" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><text x="490" y="245" font-size="20" fill="#17334a">训练</text><text x="40" y="490" font-size="23" fill="#17334a">正例：提高已配对图文的相似度。</text><text x="40" y="535" font-size="23" fill="#17334a">对比项：让正确配对的分数相对其他候选更高。</text><text x="40" y="580" font-size="20" fill="#17334a">两个编码器一起调整；相似图片可能同样适合一段描述，不能把所有非配对项当作语义相反。</text><text x="35" y="620" font-size="17" fill="#17334a">二维位置仅作概念示意，并非真实嵌入投影；实际训练比较高维归一化向量的方向。</text></g></svg>