<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="605" viewBox="0 0 1100 605"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#477b8b"/></marker></defs><rect width="1100" height="605" rx="18" fill="#f7fafc"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#17334a">CNN：一个小窗口，穿过所有颜色通道</text><text x="35" y="95" font-size="22" fill="#17334a">把 RGB 图片想成三张叠在一起的数表；一个卷积核要同时看三个通道。</text><polygon points="109,136 124,121 334,121 319,136" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="319,136 334,121 334,331 319,346" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="109" y="136" width="210" height="210" fill="#d9e4f7" stroke="#477b8b" stroke-width="2"/><polygon points="87,158 102,143 312,143 297,158" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="297,158 312,143 312,353 297,368" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="87" y="158" width="210" height="210" fill="#dceede" stroke="#477b8b" stroke-width="2"/><polygon points="65,180 80,165 290,165 275,180" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="275,180 290,165 290,375 275,390" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="65" y="180" width="210" height="210" fill="#f4d9d5" stroke="#477b8b" stroke-width="2"/><path d="M95 180 V390 M65 210 H275" stroke="#ffffff"/><path d="M125 180 V390 M65 240 H275" stroke="#ffffff"/><path d="M155 180 V390 M65 270 H275" stroke="#ffffff"/><path d="M185 180 V390 M65 300 H275" stroke="#ffffff"/><path d="M215 180 V390 M65 330 H275" stroke="#ffffff"/><path d="M245 180 V390 M65 360 H275" stroke="#ffffff"/><rect x="125" y="240" width="90" height="90" fill="#f3c477" fill-opacity=".75" stroke="#bf6c2f" stroke-width="3"/><text x="65" y="435" font-size="22" fill="#17334a">输入：H × W × 3</text><text x="65" y="470" font-size="20" fill="#17334a">橙色框沿高、宽滑动</text><path d="M345 265 L400 265" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><polygon points="459,186 471,174 561,174 549,186" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="549,186 561,174 561,264 549,276" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="459" y="186" width="90" height="90" fill="#d9e4f7" stroke="#477b8b" stroke-width="2"/><polygon points="442,203 454,191 544,191 532,203" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="532,203 544,191 544,281 532,293" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="442" y="203" width="90" height="90" fill="#dceede" stroke="#477b8b" stroke-width="2"/><polygon points="425,220 437,208 527,208 515,220" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="515,220 527,208 527,298 515,310" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="425" y="220" width="90" height="90" fill="#f4d9d5" stroke="#477b8b" stroke-width="2"/><text x="402" y="365" font-size="21" fill="#17334a">一个核：3 × 3 × 3</text><text x="402" y="405" font-size="20" fill="#17334a">27 次乘法再求和</text><text x="402" y="435" font-size="19" fill="#17334a">（再加一个偏置）</text><path d="M575 265 L640 265" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><polygon points="665,185 683,167 838,167 820,185" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="820,185 838,167 838,322 820,340" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="665" y="185" width="155" height="155" fill="#d4e9e5" stroke="#477b8b" stroke-width="2"/><rect x="720" y="240" width="24" height="24" fill="#d88a42"/><text x="635" y="390" font-size="21" fill="#17334a">一个位置 → 一个数</text><text x="635" y="425" font-size="19" fill="#17334a">滑完整图 → 一张特征图</text><polygon points="960,159 970,149 1055,149 1045,159" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="1045,159 1055,149 1055,269 1045,279" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="960" y="159" width="85" height="120" fill="#dce7f6" stroke="#477b8b" stroke-width="2"/><polygon points="945,181 955,171 1040,171 1030,181" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="1030,181 1040,171 1040,291 1030,301" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="945" y="181" width="85" height="120" fill="#fae8cf" stroke="#477b8b" stroke-width="2"/><polygon points="930,203 940,193 1025,193 1015,203" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="1015,203 1025,193 1025,313 1015,323" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="930" y="203" width="85" height="120" fill="#eadff1" stroke="#477b8b" stroke-width="2"/><polygon points="915,225 925,215 1010,215 1000,225" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="1000,225 1010,215 1010,335 1000,345" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="915" y="225" width="85" height="120" fill="#daeee8" stroke="#477b8b" stroke-width="2"/><text x="865" y="460" font-size="19" fill="#17334a">多个核 → 多张特征图</text><text x="35" y="540" font-size="21" fill="#17334a">输入深度是通道，输出深度是检测器数量；图中的“厚度”不是物体的真实三维深度。</text><text x="35" y="580" font-size="17" fill="#17334a">扩展示意采用 RGB；本课可执行卷积例子使用单通道灰度图，因此核只有 3×3×1。</text></g></svg>