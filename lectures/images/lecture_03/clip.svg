<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#477b8b"/></marker></defs><rect width="1100" height="450" rx="18" fill="#f7fafc"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#17334a">CLIP：两条分支独立编码，用配对关系共同训练</text><rect x="35" y="110" width="210" height="75" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="51" y="140" font-size="19" fill="#17334a">图像 batch</text><text x="51" y="168" font-size="19" fill="#17334a">I₁、I₂、I₃</text><path d="M255 148 L310 148" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="325" y="110" width="230" height="75" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="341" y="140" font-size="19" fill="#17334a">图像编码器</text><text x="341" y="168" font-size="19" fill="#17334a">CNN 或 ViT</text><path d="M565 148 L620 148" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="110" width="200" height="75" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="651" y="140" font-size="19" fill="#17334a">投影＋归一化</text><text x="651" y="168" font-size="19" fill="#17334a">图像向量 U</text><rect x="35" y="245" width="210" height="75" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="51" y="275" font-size="19" fill="#17334a">对应描述 batch</text><text x="51" y="303" font-size="19" fill="#17334a">T₁、T₂、T₃</text><path d="M255 283 L310 283" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="325" y="245" width="230" height="75" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="341" y="275" font-size="19" fill="#17334a">文本编码器</text><text x="341" y="303" font-size="19" fill="#17334a">Transformer</text><path d="M565 283 L620 283" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="245" width="200" height="75" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="651" y="275" font-size="19" fill="#17334a">投影＋归一化</text><text x="651" y="303" font-size="19" fill="#17334a">文本向量 V</text><path d="M845 148 L885 202" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><path d="M845 283 L885 242" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="895" y="170" width="170" height="110" rx="12" fill="#ffebd2" stroke="#609899"/><text x="911" y="200" font-size="19" fill="#17334a">两两相似度</text><text x="911" y="228" font-size="19" fill="#17334a">3×3 分数表</text><text x="911" y="256" font-size="19" fill="#17334a">双向匹配损失</text><text x="35" y="425" font-size="17" fill="#17334a">原始 CLIP 没有在两条分支之间做逐 token 的交叉注意力；它比较整图与整段文本的向量。</text></g></svg>