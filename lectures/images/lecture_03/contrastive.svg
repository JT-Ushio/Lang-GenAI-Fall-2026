="19" fill="#17334a">1</text><rect x="650" y="290" width="130" height="53" rx="12" fill="#bde4d8" stroke="#609899"/><text x="666" y="320" font-size="19" fill="#17334a">8</text><text x="35" y="400" font-size="21" fill="#17334a">逐行：这张图匹配哪段文字？     逐列：这段文字匹配哪张图？</text><text x="35" y="435" font-size="17" fill="#17334a">这里是人为构造的分数示意，不是真实 CLIP 输出；其他项可能是语义相关的“假负例”。</text></g></svg>