<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#477b8b"/></marker></defs><rect width="1100" height="650" rx="18" fill="#f7fafc"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#17334a">RNN：猫吃鱼 / 鱼吃猫，笔记怎样逐步改变？</text><text x="35" y="95" font-size="22" fill="#17334a">每读一个词，就改写一次“阅读笔记”；两个方向使用完全相同的更新规则。</text><text x="35" y="200" font-size="18" fill="#17334a">从零开始</text><rect x="160" y="140" width="260" height="170" rx="12" fill="#ffffff" stroke="#609899"/><text x="176" y="170" font-size="19" fill="#17334a">读入「猫」</text><text x="176" y="204" font-size="18" fill="#17334a">第 1 步状态</text><rect x="176" y="220" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="176" y="220" width="110.49" height="25" rx="4" fill="#77b9b2"/><text x="331" y="240" font-size="19" fill="#17334a">0.762</text><rect x="176" y="250" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="176" y="250" width="0" height="25" rx="4" fill="#f2bd79"/><text x="331" y="270" font-size="19" fill="#17334a">0.000</text><path d="M425 226 L460 226" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="470" y="140" width="260" height="170" rx="12" fill="#ffffff" stroke="#609899"/><text x="486" y="170" font-size="19" fill="#17334a">读入「吃」</text><text x="486" y="204" font-size="18" fill="#17334a">第 2 步状态</text><rect x="486" y="220" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="486" y="220" width="102.515" height="25" rx="4" fill="#77b9b2"/><text x="641" y="240" font-size="19" fill="#17334a">0.707</text><rect x="486" y="250" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="486" y="250" width="66.99000000000001" height="25" rx="4" fill="#f2bd79"/><text x="641" y="270" font-size="19" fill="#17334a">0.462</text><path d="M735 226 L770 226" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="780" y="140" width="260" height="170" rx="12" fill="#ffffff" stroke="#609899"/><text x="796" y="170" font-size="19" fill="#17334a">读入「鱼」</text><text x="796" y="204" font-size="18" fill="#17334a">第 3 步状态</text><rect x="796" y="220" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="796" y="220" width="49.155" height="25" rx="4" fill="#77b9b2"/><text x="951" y="240" font-size="19" fill="#17334a">0.339</text><rect x="796" y="250" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="796" y="250" width="122.235" height="25" rx="4" fill="#f2bd79"/><text x="951" y="270" font-size="19" fill="#17334a">0.843</text><text x="35" y="420" font-size="18" fill="#17334a">从零开始</text><rect x="160" y="360" width="260" height="170" rx="12" fill="#ffffff" stroke="#609899"/><text x="176" y="390" font-size="19" fill="#17334a">读入「鱼」</text><text x="176" y="424" font-size="18" fill="#17334a">第 1 步状态</text><rect x="176" y="440" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="176" y="440" width="0" height="25" rx="4" fill="#77b9b2"/><text x="331" y="460" font-size="19" fill="#17334a">0.000</text><rect x="176" y="470" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="176" y="470" width="110.49" height="25" rx="4" fill="#f2bd79"/><text x="331" y="490" font-size="19" fill="#17334a">0.762</text><path d="M425 446 L460 446" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="470" y="360" width="260" height="170" rx="12" fill="#ffffff" stroke="#609899"/><text x="486" y="390" font-size="19" fill="#17334a">读入「吃」</text><text x="486" y="424" font-size="18" fill="#17334a">第 2 步状态</text><rect x="486" y="440" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="486" y="440" width="66.99000000000001" height="25" rx="4" fill="#77b9b2"/><text x="641" y="460" font-size="19" fill="#17334a">0.462</text><rect x="486" y="470" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="486" y="470" width="102.515" height="25" rx="4" fill="#f2bd79"/><text x="641" y="490" font-size="19" fill="#17334a">0.707</text><path d="M735 446 L770 446" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="780" y="360" width="260" height="170" rx="12" fill="#ffffff" stroke="#609899"/><text x="796" y="390" font-size="19" fill="#17334a">读入「猫」</text><text x="796" y="424" font-size="18" fill="#17334a">第 3 步状态</text><rect x="796" y="440" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="796" y="440" width="122.235" height="25" rx="4" fill="#77b9b2"/><text x="951" y="460" font-size="19" fill="#17334a">0.843</text><rect x="796" y="470" width="145" height="25" rx="4" fill="#e1e9ef"/><rect x="796" y="470" width="49.155" height="25" rx="4" fill="#f2bd79"/><text x="951" y="490" font-size="19" fill="#17334a">0.339</text><text x="35" y="585" font-size="25" fill="#17334a">相同词语，顺序不同 → 最后留下的向量不同。</text><text x="35" y="625" font-size="17" fill="#17334a">数值对应本课固定递推的结果（保留三位小数）；两个维度没有预先指定的语言学含义。</text></g></svg>