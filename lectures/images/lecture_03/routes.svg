<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#477b8b"/></marker></defs><rect width="1100" height="450" rx="18" fill="#f7fafc"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#17334a">两条表示学习路线，在 CLIP 中汇合</text><text x="35" y="105" font-size="22" fill="#17334a">文本分支</text><text x="35" y="265" font-size="22" fill="#17334a">图像分支</text><rect x="35" y="125" width="215" height="78" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="51" y="155" font-size="19" fill="#17334a">词／子词向量</text><rect x="290" y="125" width="215" height="78" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="306" y="155" font-size="19" fill="#17334a">RNN：传递状态</text><rect x="550" y="125" width="215" height="78" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="566" y="155" font-size="19" fill="#17334a">Transformer</text><text x="566" y="183" font-size="19" fill="#17334a">按内容聚合信息</text><path d="M253 165 L280 165" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><path d="M508 165 L540 165" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="285" width="215" height="78" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="51" y="315" font-size="19" fill="#17334a">像素数组</text><rect x="290" y="285" width="215" height="78" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="306" y="315" font-size="19" fill="#17334a">CNN：局部特征</text><rect x="550" y="285" width="215" height="78" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="566" y="315" font-size="19" fill="#17334a">ViT</text><text x="566" y="343" font-size="19" fill="#17334a">图像块序列</text><path d="M253 325 L280 325" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><path d="M508 325 L540 325" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="835" y="195" width="225" height="90" rx="12" fill="#ffebd2" stroke="#609899"/><text x="851" y="225" font-size="19" fill="#17334a">CLIP：图文对齐</text><text x="851" y="253" font-size="19" fill="#17334a">共享可比较的空间</text><path d="M770 164 L825 220" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><path d="M770 325 L825 265" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><text x="35" y="425" font-size="17" fill="#17334a">路线是本课的叙述顺序；不是所有模型都经历相同阶段，CLIP 图像分支也可用 CNN。</text></g></svg>