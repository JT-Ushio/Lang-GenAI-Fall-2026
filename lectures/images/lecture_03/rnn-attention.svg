<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="545" viewBox="0 0 1100 545"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#477b8b"/></marker></defs><rect width="1100" height="545" rx="18" fill="#f7fafc"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#17334a">从“逐步传递的笔记”到“按需参考上下文”</text><text x="35" y="98" font-size="22" fill="#17334a">RNN：信息沿状态链传递</text><rect x="65" y="120" width="180" height="60" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="81" y="150" font-size="19" fill="#17334a">状态 h1</text><text x="95" y="215" font-size="21" fill="#17334a">小王</text><path d="M250 150 L305 150" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="315" y="120" width="180" height="60" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="331" y="150" font-size="19" fill="#17334a">状态 h2</text><text x="345" y="215" font-size="21" fill="#17334a">把书</text><path d="M500 150 L555 150" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="565" y="120" width="180" height="60" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="581" y="150" font-size="19" fill="#17334a">状态 h3</text><text x="595" y="215" font-size="21" fill="#17334a">递给</text><path d="M750 150 L805 150" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="815" y="120" width="180" height="60" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="831" y="150" font-size="19" fill="#17334a">状态 h4</text><text x="845" y="215" font-size="21" fill="#17334a">小李</text><text x="35" y="282" font-size="22" fill="#17334a">自注意力：每个位置按相关程度聚合其他位置的信息</text><rect x="65" y="340" width="180" height="55" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="81" y="370" font-size="19" fill="#17334a">小王</text><path d="M155 400 L600 425" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="315" y="340" width="180" height="55" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="331" y="370" font-size="19" fill="#17334a">把书</text><path d="M405 400 L600 425" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="565" y="340" width="180" height="55" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="581" y="370" font-size="19" fill="#17334a">递给</text><path d="M655 400 L600 425" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="815" y="340" width="180" height="55" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="831" y="370" font-size="19" fill="#17334a">小李</text><path d="M905 400 L600 425" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="480" y="430" width="260" height="55" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="496" y="460" font-size="19" fill="#17334a">聚合为“递给”的新表示</text><text x="35" y="520" font-size="17" fill="#17334a">箭头仅表示信息通路；没有展示真实模型学到的权重，类比不等同于人类阅读机制。</text></g></svg>