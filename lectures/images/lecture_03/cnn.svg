<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#477b8b"/></marker></defs><rect width="1100" height="390" rx="18" fill="#f7fafc"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#17334a">CNN：同一个局部检测器，寻找不同位置的模式</text><rect x="35" y="125" width="220" height="125" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="51" y="155" font-size="19" fill="#17334a">局部窗口：3×3</text><text x="51" y="183" font-size="19" fill="#17334a">同一组权重</text><text x="51" y="211" font-size="19" fill="#17334a">在图像上滑动</text><path d="M265 185 L320 185" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="335" y="125" width="205" height="125" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="351" y="155" font-size="19" fill="#17334a">特征图</text><text x="351" y="183" font-size="19" fill="#17334a">记录各位置</text><text x="351" y="211" font-size="19" fill="#17334a">对某种模式的响应</text><path d="M550 185 L605 185" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="620" y="125" width="200" height="125" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="636" y="155" font-size="19" fill="#17334a">多层组合</text><text x="636" y="183" font-size="19" fill="#17334a">更大的感受野</text><text x="636" y="211" font-size="19" fill="#17334a">局部 → 更大结构</text><path d="M830 185 L875 185" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="885" y="125" width="180" height="125" rx="12" fill="#e0f0ef" stroke="#609899"/><text x="901" y="155" font-size="19" fill="#17334a">整图表示</text><text x="901" y="183" font-size="19" fill="#17334a">分类或对齐</text><text x="45" y="320" font-size="21" fill="#17334a">语言类比：局部搭配 → 更大结构；但卷积窗口不是语言学短语边界。</text><text x="35" y="365" font-size="17" fill="#17334a">感受野是某个特征能够受到输入影响的区域；示意不代表每层必然对应可命名的概念。</text></g></svg>