<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#477b8b"/></marker></defs><rect width="1100" height="590" rx="18" fill="#f7fafc"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" fill="#17334a">CLIP：让图像和文字的“笔记”可以比较</text><text x="35" y="95" font-size="22" fill="#17334a">同一件事，可以用图像表达，也可以用文字描述。CLIP 学习两者的对应关系。</text><rect x="35" y="130" width="225" height="150" rx="12" fill="#ffffff" stroke="#609899"/><text x="51" y="160" font-size="19" fill="#17334a">图像</text><g transform="translate(100 180) scale(1)"><polygon points="10,23 8,0 28,14 52,14 72,0 70,23" fill="#edb56b" stroke="#477b8b" stroke-width="2"/><ellipse cx="40" cy="36" rx="33" ry="27" fill="#edb56b"/><circle cx="28" cy="31" r="3" fill="#17334a"/><circle cx="52" cy="31" r="3" fill="#17334a"/><path d="M36 41 L44 41 L40 46Z M9 41 L-1 38 M9 48 L-1 51 M71 41 L81 38 M71 48 L81 51" stroke="#17334a" fill="#17334a"/></g><rect x="35" y="330" width="225" height="100" rx="12" fill="#ffffff" stroke="#609899"/><text x="51" y="360" font-size="19" fill="#17334a">描述</text><text x="51" y="388" font-size="19" fill="#17334a">a photo of a cat</text><path d="M270 205 L320 205" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><path d="M270 380 L320 380" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><polygon points="340,160 358,142 563,142 545,160" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="545,160 563,142 563,237 545,255" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="340" y="160" width="205" height="95" fill="#d7ebe6" stroke="#477b8b" stroke-width="2"/><text x="358" y="201" font-size="23" fill="#17334a">图像编码器</text><text x="358" y="232" font-size="20" fill="#17334a">CNN 或 ViT</text><polygon points="340,340 358,322 563,322 545,340" fill="#e8eff5" stroke="#477b8b" stroke-width="2"/><polygon points="545,340 563,322 563,417 545,435" fill="#b6c8da" stroke="#477b8b" stroke-width="2"/><rect x="340" y="340" width="205" height="95" fill="#e5def0" stroke="#477b8b" stroke-width="2"/><text x="358" y="381" font-size="23" fill="#17334a">文本编码器</text><text x="358" y="412" font-size="20" fill="#17334a">Transformer</text><path d="M575 205 L635 205" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><path d="M575 380 L635 380" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="655" y="175" width="45" height="14" rx="3" fill="#78b7aa"/><rect x="655" y="195" width="65" height="14" rx="3" fill="#78b7aa"/><rect x="655" y="215" width="30" height="14" rx="3" fill="#78b7aa"/><rect x="655" y="235" width="55" height="14" rx="3" fill="#78b7aa"/><rect x="655" y="350" width="45" height="14" rx="3" fill="#ad91bc"/><rect x="655" y="370" width="65" height="14" rx="3" fill="#ad91bc"/><rect x="655" y="390" width="30" height="14" rx="3" fill="#ad91bc"/><rect x="655" y="410" width="55" height="14" rx="3" fill="#ad91bc"/><text x="630" y="286" font-size="20" fill="#17334a">图像向量</text><text x="630" y="462" font-size="20" fill="#17334a">文字向量</text><path d="M735 210 L805 275" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><path d="M735 385 L805 325" stroke="#477b8b" stroke-width="3" marker-end="url(#a)"/><rect x="820" y="235" width="245" height="140" rx="12" fill="#ffebd2" stroke="#609899"/><text x="836" y="265" font-size="19" fill="#17334a">投影并归一化后</text><text x="836" y="293" font-size="19" fill="#17334a">比较向量方向</text><text x="836" y="321" font-size="19" fill="#17334a">匹配项得分更高</text><text x="35" y="525" font-size="22" fill="#17334a">像两位用不同方式做笔记的同学：各自整理，再比较是否在说同一件事。</text><text x="35" y="565" font-size="17" fill="#17334a">条形只是向量符号，不是真实特征；两条分支独立编码，通过图文配对共同训练。</text></g></svg>