<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475"><rect width="960" height="475" rx="20" fill="#f4f7fc"/><g font-family="sans-serif" fill="#20334d"><text x="40" y="48" font-size="27" font-weight="bold">训练与使用：两个不同的过程</text><text x="40" y="119" font-size="20">训练</text><rect x="185" y="83" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="292" y="126" text-anchor="middle" font-size="20">训练数据</text><text x="411" y="126" font-size="22">→</text><rect x="435" y="83" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="542" y="126" text-anchor="middle" font-size="20">学习规律、更新参数</text><text x="661" y="126" font-size="22">→</text><rect x="685" y="83" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="792" y="126" text-anchor="middle" font-size="20">得到模型</text><text x="40" y="234" font-size="20">使用</text><rect x="185" y="198" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="292" y="241" text-anchor="middle" font-size="20">指令 + 上下文</text><text x="411" y="241" font-size="22">→</text><rect x="435" y="198" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="542" y="241" text-anchor="middle" font-size="20">固定参数下生成</text><text x="661" y="241" font-size="22">→</text><rect x="685" y="198" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="792" y="241" text-anchor="middle" font-size="20">候选输出</text><text x="40" y="349" font-size="20">验证</text><rect x="185" y="313" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="292" y="356" text-anchor="middle" font-size="20">原始需求与证据</text><text x="411" y="356" font-size="22">→</text><rect x="435" y="313" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="542" y="356" text-anchor="middle" font-size="20">人工 / 程序检查</text><text x="661" y="356" font-size="22">→</text><rect x="685" y="313" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="792" y="356" text-anchor="middle" font-size="20">修改、重试或采纳</text><text x="40" y="451" font-size="17" fill="#52667e">提示词改变本次生成的条件；普通对话不等于对模型进行一次参数训练。</text></g></svg>