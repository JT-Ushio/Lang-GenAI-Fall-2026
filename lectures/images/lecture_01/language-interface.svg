<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475"><rect width="960" height="475" rx="20" fill="#f4f7fc"/><g font-family="sans-serif" fill="#20334d"><text x="40" y="48" font-size="27" font-weight="bold">语言：描述世界，也组织行动</text><text x="40" y="119" font-size="20">理解</text><rect x="185" y="83" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="292" y="126" text-anchor="middle" font-size="20">图像 / 语音 / 视频</text><text x="411" y="126" font-size="22">→</text><rect x="435" y="83" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="542" y="126" text-anchor="middle" font-size="20">跨模态表示与对齐</text><text x="661" y="126" font-size="22">→</text><rect x="685" y="83" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="792" y="126" text-anchor="middle" font-size="20">语言描述与问答</text><text x="40" y="234" font-size="20">生成</text><rect x="185" y="198" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="292" y="241" text-anchor="middle" font-size="20">语言目标与约束</text><text x="411" y="241" font-size="22">→</text><rect x="435" y="198" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="542" y="241" text-anchor="middle" font-size="20">条件生成</text><text x="661" y="241" font-size="22">→</text><rect x="685" y="198" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="792" y="241" text-anchor="middle" font-size="20">图像 / 声音 / 视频</text><text x="40" y="349" font-size="20">行动</text><rect x="185" y="313" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="292" y="356" text-anchor="middle" font-size="20">自然语言任务</text><text x="411" y="356" font-size="22">→</text><rect x="435" y="313" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="542" y="356" text-anchor="middle" font-size="20">规划、工具与反馈</text><text x="661" y="356" font-size="22">→</text><rect x="685" y="313" width="215" height="72" rx="12" fill="#dfe8ff"/><text x="792" y="356" text-anchor="middle" font-size="20">可检查的任务结果</text><text x="40" y="451" font-size="17" fill="#52667e">课程主线：表示 → 对齐 → 生成 → 交互与控制；各模态仍保留自身结构。</text></g></svg>